<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>除夕接年货 - 新年小游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background-color: #d32f2f;
            overflow: hidden;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* 开始弹窗 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(211, 47, 47, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 5px solid #ffeb3b;
            position: relative;
            overflow: hidden;
        }
        
        .modal-content::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, #ff9800, #ffeb3b, #ff9800);
            z-index: 2;
        }
        
        h1 {
            color: #ffeb3b;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 #d32f2f;
            letter-spacing: 1px;
        }
        
        h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .btn {
            background: linear-gradient(to bottom, #ffeb3b, #ff9800);
            color: #d32f2f;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            width: 100%;
            max-width: 250px;
        }
        
        .btn:hover, .btn:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        /* 游戏区域 */
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* 分数显示 */
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #ff5722, #d32f2f);
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffeb3b;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
            border: 3px solid #ff9800;
            display: flex;
            align-items: center;
        }
        
        #score-display i {
            margin-right: 10px;
            font-size: 1.6rem;
        }
        
        /* 计时器 */
        #timer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
            border: 3px solid #ffeb3b;
            display: flex;
            align-items: center;
        }
        
        #timer i {
            margin-right: 10px;
            font-size: 1.6rem;
        }
        
        /* 结束弹窗 */
        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }
        
        #final-score {
            font-size: 4rem;
            color: #ffeb3b;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.7);
        }
        
        #result-text {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #fff;
            max-width: 500px;
            line-height: 1.4;
        }
        
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        
        /* 音乐控制按钮 */
        #music-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            cursor: pointer;
            border: 2px solid #ff9800;
        }
        
        #music-control i {
            font-size: 1.5rem;
            color: #ff9800;
        }
        
        /* 游戏说明 */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            max-width: 300px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #fff;
            border: 2px solid #ff9800;
            z-index: 50;
        }
        
        /* 适配不同屏幕尺寸 */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            h2 {
                font-size: 1.3rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            #score-display, #timer {
                font-size: 1.4rem;
                padding: 10px 20px;
            }
            
            #final-score {
                font-size: 3rem;
            }
            
            #result-text {
                font-size: 1.4rem;
            }
            
            #instructions {
                font-size: 0.8rem;
                max-width: 200px;
            }
        }
        
        /* 物品分值提示 */
        .item-points {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        .point-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.9rem;
        }
        
        .item-preview {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 开始游戏弹窗 -->
        <div id="start-screen">
            <div class="modal-content">
                <h1><i class="fas fa-fire"></i> 除夕接年货 <i class="fas fa-fire"></i></h1>
                <h2>把年货带回家！</h2>
                <p>除夕到，福气到！移动下方的福袋，接住从天上掉落的年货，把它们带回家！</p>
                <p>游戏限时30秒，接到的年货越多，福气越旺！</p>
                
                <div class="item-points">
                    <div class="point-item">
                        <div class="item-preview" style="background-image: url('item1.png');"></div>
                        <div>糖果：1分</div>
                    </div>
                    <div class="point-item">
                        <div class="item-preview" style="background-image: url('item3.png');"></div>
                        <div>春联：3分</div>
                    </div>
                    <div class="point-item">
                        <div class="item-preview" style="background-image: url('item5.png');"></div>
                        <div>红包：5分</div>
                    </div>
                    <div class="point-item">
                        <div class="item-preview" style="background-image: url('item10.png');"></div>
                        <div>元宝：10分</div>
                    </div>
                </div>
                
                <button id="start-btn" class="btn">
                    <i class="fas fa-play-circle"></i> 开始游戏
                </button>
                <p style="margin-top: 15px; font-size: 0.9rem; color: #ffeb3b;">提示：使用手指左右滑动控制福袋移动</p>
            </div>
        </div>
        
        <!-- 游戏画布 -->
        <canvas id="game-canvas"></canvas>
        
        <!-- 分数显示 -->
        <div id="score-display">
            <i class="fas fa-star"></i> <span id="score">0</span> 分
        </div>
        
        <!-- 计时器 -->
        <div id="timer">
            <i class="fas fa-clock"></i> <span id="time">30</span> 秒
        </div>
        
        <!-- 音乐控制 -->
        <div id="music-control">
            <i id="music-icon" class="fas fa-volume-up"></i>
        </div>
        
        <!-- 游戏说明 -->
        <div id="instructions">
            <i class="fas fa-info-circle"></i> 左右滑动屏幕移动福袋，接住掉落的年货！
        </div>
        
        <!-- 结束游戏弹窗 -->
        <div id="end-screen">
            <div class="modal-content">
                <h1><i class="fas fa-trophy"></i> 游戏结束 <i class="fas fa-trophy"></i></h1>
                <h2>你的除夕福气值</h2>
                <div id="final-score">0</div>
                <p id="result-text">再接再厉！</p>
                <div class="btn-container">
                    <button id="restart-btn" class="btn">
                        <i class="fas fa-redo"></i> 再来一局
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bg-music" loop>
        <source src="chuxibgm.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        // 游戏变量
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const endScreen = document.getElementById('end-screen');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const finalScoreDisplay = document.getElementById('final-score');
        const resultText = document.getElementById('result-text');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const bgMusic = document.getElementById('bg-music');
        const musicControl = document.getElementById('music-control');
        const musicIcon = document.getElementById('music-icon');
        
        // 设置画布尺寸为全屏
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // 游戏状态
        let game = {
            score: 0,
            timeLeft: 30,
            isRunning: false,
            gameLoop: null,
            items: [],
            lastItemTime: 0,
            catcher: {
                x: 0,
                y: 0,
                width: 120,
                height: 120,
                speed: 15
            },
            // 物品配置
            itemConfig: [
                { type: 'candy', value: 1, speed: 3, probability: 0.4, image: 'item1.png', size: 80 },
                { type: 'couplet', value: 3, speed: 4, probability: 0.3, image: 'item3.png', size: 80 },
                { type: 'redpacket', value: 5, speed: 5, probability: 0.2, image: 'item5.png', size: 80 },
                { type: 'gold', value: 10, speed: 6, probability: 0.1, image: 'item10.png', size: 80 }
            ],
            // 加载的图像
            images: {},
            // 触摸控制
            touchStartX: 0,
            catcherStartX: 0,
            isDragging: false
        };
        
        // 加载图像
        function loadImages() {
            // 加载背景图
            game.images.background = new Image();
            game.images.background.src = 'background.jpg';
            
            // 加载福袋
            game.images.catcher = new Image();
            game.images.catcher.src = 'catcher.png';
            
            // 加载物品图像
            game.itemConfig.forEach(config => {
                game.images[config.type] = new Image();
                game.images[config.type].src = config.image;
            });
        }
        
        // 初始化游戏
        function initGame() {
            game.score = 0;
            game.timeLeft = 30;
            game.items = [];
            game.lastItemTime = 0;
            
            // 初始化福袋位置
            game.catcher.x = canvas.width / 2 - game.catcher.width / 2;
            game.catcher.y = canvas.height - game.catcher.height - 20;
            
            // 更新显示
            scoreDisplay.textContent = game.score;
            timeDisplay.textContent = game.timeLeft;
            
            // 确保画布尺寸正确
            resizeCanvas();
            
            // 开始游戏循环
            if (game.gameLoop) {
                clearInterval(game.gameLoop);
            }
            
            game.gameLoop = setInterval(updateGame, 1000 / 60); // 60fps
            game.isRunning = true;
        }
        
        // 更新游戏状态
        function updateGame() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            if (game.images.background.complete) {
                ctx.drawImage(game.images.background, 0, 0, canvas.width, canvas.height);
            } else {
                // 备用背景色
                ctx.fillStyle = '#d32f2f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // 生成新物品
            const now = Date.now();
            if (now - game.lastItemTime > 500 && game.items.length < 15) { // 最多15个物品同时存在
                const rand = Math.random();
                let cumulativeProb = 0;
                
                for (const config of game.itemConfig) {
                    cumulativeProb += config.probability;
                    if (rand <= cumulativeProb) {
                        createItem(config);
                        game.lastItemTime = now;
                        break;
                    }
                }
            }
            
            // 更新和绘制物品
            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                
                // 更新位置
                item.y += item.speed;
                
                // 检查是否被接住
                if (item.y + item.size > game.catcher.y &&
                    item.x + item.size > game.catcher.x &&
                    item.x < game.catcher.x + game.catcher.width &&
                    item.y < game.catcher.y + game.catcher.height) {
                    
                    // 增加分数
                    game.score += item.value;
                    scoreDisplay.textContent = game.score;
                    
                    // 移除物品
                    game.items.splice(i, 1);
                    
                    // 创建得分动画
                    createScoreAnimation(item.x, item.y, `+${item.value}`);
                    continue;
                }
                
                // 检查是否超出屏幕
                if (item.y > canvas.height) {
                    game.items.splice(i, 1);
                    continue;
                }
                
                // 绘制物品
                if (game.images[item.type].complete) {
                    ctx.drawImage(game.images[item.type], item.x, item.y, item.size, item.size);
                } else {
                    // 备用绘制
                    ctx.fillStyle = item.color;
                    ctx.beginPath();
                    ctx.arc(item.x + item.size/2, item.y + item.size/2, item.size/2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 绘制福袋
            if (game.images.catcher.complete) {
                ctx.drawImage(game.images.catcher, game.catcher.x, game.catcher.y, game.catcher.width, game.catcher.height);
            } else {
                // 备用绘制
                ctx.fillStyle = '#ff9800';
                ctx.fillRect(game.catcher.x, game.catcher.y, game.catcher.width, game.catcher.height);
            }
            
            // 绘制分数动画
            drawScoreAnimations();
        }
        
        // 创建新物品
        function createItem(config) {
            const size = config.size;
            const x = Math.random() * (canvas.width - size);
            
            const item = {
                type: config.type,
                value: config.value,
                speed: config.speed,
                x: x,
                y: -size,
                size: size,
                color: getItemColor(config.type)
            };
            
            game.items.push(item);
        }
        
        // 根据物品类型获取颜色
        function getItemColor(type) {
            switch(type) {
                case 'candy': return '#ff4081';
                case 'couplet': return '#4caf50';
                case 'redpacket': return '#f44336';
                case 'gold': return '#ff9800';
                default: return '#9c27b0';
            }
        }
        
        // 创建得分动画
        let scoreAnimations = [];
        
        function createScoreAnimation(x, y, text) {
            scoreAnimations.push({
                x: x,
                y: y,
                text: text,
                alpha: 1,
                life: 60 // 帧数
            });
        }
        
        function drawScoreAnimations() {
            for (let i = scoreAnimations.length - 1; i >= 0; i--) {
                const anim = scoreAnimations[i];
                
                ctx.save();
                ctx.globalAlpha = anim.alpha;
                ctx.font = 'bold 28px Arial';
                ctx.fillStyle = '#ffeb3b';
                ctx.textAlign = 'center';
                ctx.fillText(anim.text, anim.x + 40, anim.y);
                ctx.restore();
                
                anim.y -= 1.5;
                anim.alpha -= 0.016;
                anim.life--;
                
                if (anim.life <= 0) {
                    scoreAnimations.splice(i, 1);
                }
            }
        }
        
        // 游戏计时
        function startTimer() {
            const timer = setInterval(() => {
                if (!game.isRunning) {
                    clearInterval(timer);
                    return;
                }
                
                game.timeLeft--;
                timeDisplay.textContent = game.timeLeft;
                
                if (game.timeLeft <= 0) {
                    game.isRunning = false;
                    clearInterval(timer);
                    clearInterval(game.gameLoop);
                    endGame();
                }
            }, 1000);
        }
        
        // 结束游戏
        function endGame() {
            finalScoreDisplay.textContent = game.score;
            
            // 根据分数显示不同评价
            let result = "";
            if (game.score >= 150) {
                result = "福星高照！你接到的年货堆成山啦！新年必定财运亨通！";
            } else if (game.score >= 100) {
                result = "满载而归！福袋都装不下啦！新年福气满满！";
            } else if (game.score >= 70) {
                result = "收获颇丰！年货满满，新年一定红红火火！";
            } else if (game.score >= 40) {
                result = "不错哦！接到的年货够过年啦！新年快乐！";
            } else {
                result = "再接再厉！福气正在路上，新年一定会更好！";
            }
            
            resultText.textContent = result;
            endScreen.style.display = "flex";
        }
        
        // 事件监听
        startBtn.addEventListener('click', () => {
            startScreen.style.display = "none";
            initGame();
            startTimer();
            
            // 播放背景音乐
            bgMusic.play().catch(e => {
                console.log("自动播放被阻止，请手动点击播放");
            });
        });
        
        restartBtn.addEventListener('click', () => {
            endScreen.style.display = "none";
            initGame();
            startTimer();
        });
        
        // 音乐控制
        let isMusicPlaying = true;
        musicControl.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicIcon.className = "fas fa-volume-mute";
            } else {
                bgMusic.play();
                musicIcon.className = "fas fa-volume-up";
            }
            isMusicPlaying = !isMusicPlaying;
        });
        
        // 触摸控制
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            game.touchStartX = e.touches[0].clientX;
            game.catcherStartX = game.catcher.x;
            game.isDragging = true;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!game.isDragging || !game.isRunning) return;
            
            const touchX = e.touches[0].clientX;
            const deltaX = touchX - game.touchStartX;
            let newX = game.catcherStartX + deltaX;
            
            // 限制福袋在屏幕内
            newX = Math.max(0, Math.min(newX, canvas.width - game.catcher.width));
            game.catcher.x = newX;
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            game.isDragging = false;
        });
        
        // 鼠标控制（为桌面测试提供）
        canvas.addEventListener('mousedown', (e) => {
            game.touchStartX = e.clientX;
            game.catcherStartX = game.catcher.x;
            game.isDragging = true;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!game.isDragging || !game.isRunning) return;
            
            const mouseX = e.clientX;
            const deltaX = mouseX - game.touchStartX;
            let newX = game.catcherStartX + deltaX;
            
            // 限制福袋在屏幕内
            newX = Math.max(0, Math.min(newX, canvas.width - game.catcher.width));
            game.catcher.x = newX;
        });
        
        canvas.addEventListener('mouseup', () => {
            game.isDragging = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            game.isDragging = false;
        });
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            resizeCanvas();
            
            // 调整福袋位置确保在屏幕内
            if (game.catcher.x + game.catcher.width > canvas.width) {
                game.catcher.x = canvas.width - game.catcher.width;
            }
        });
        
        // 加载图像并初始化
        loadImages();
        resizeCanvas();
        
        // 确保音乐可以在用户交互后播放
        document.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("音乐播放被阻止"));
            }
        }, { once: true });
    </script>
</body>
</html>
