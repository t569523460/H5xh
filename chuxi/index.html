<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>除夕接年货</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            background-color: #f8e8d0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8B0000;
            background-image: radial-gradient(#ffcccc 2px, transparent 2px);
            background-size: 30px 30px;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 900px;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
            border-radius: 20px;
            background: linear-gradient(135deg, #ff4d4d 0%, #ff9966 100%);
        }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(255, 87, 34, 0.95);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #ffcc00;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        #timer-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 193, 7, 0.95);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            color: #8B0000;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #ff9800;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #ff6666 0%, #ff9966 100%);
            border-radius: 20px;
            padding: 25px;
            max-width: 90%;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 8px solid #ffcc00;
            position: relative;
        }
        
        .modal-content::before {
            content: "";
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border: 5px dashed #ff5722;
            border-radius: 30px;
            pointer-events: none;
        }
        
        h1 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 30px;
            text-shadow: 2px 2px 0 #ff5722;
        }
        
        h2 {
            color: #ffeb3b;
            margin-bottom: 10px;
            font-size: 24px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        p {
            color: #fff;
            line-height: 1.5;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .game-rules {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 5px solid #ffcc00;
        }
        
        .score-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            padding: 5px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            justify-content: center;
        }
        
        .score-item img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            object-fit: contain;
        }
        
        .btn {
            background: linear-gradient(to bottom, #ff5722, #e64a19);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 5px 0 #bf360c;
            transition: all 0.2s;
            width: 100%;
            max-width: 250px;
        }
        
        .btn:hover, .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #bf360c;
        }
        
        #final-score {
            font-size: 60px;
            color: #ffeb3b;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 3px 3px 0 #ff5722;
        }
        
        #result-message {
            font-size: 24px;
            color: #ffeb3b;
            margin: 20px 0;
            font-weight: bold;
            min-height: 60px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .hidden {
            display: none !important;
        }
        
        #music-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 87, 34, 0.95);
            border: 3px solid #ffcc00;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .music-icon {
            font-size: 24px;
            color: #fff;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(255, 87, 34, 0.9);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 2px solid #ffcc00;
        }
        
        @media (max-width: 500px) {
            #game-container {
                max-height: 100vh;
                border-radius: 0;
            }
            
            h1 {
                font-size: 26px;
            }
            
            h2 {
                font-size: 22px;
            }
            
            .modal-content {
                padding: 20px;
            }
            
            .score-item img {
                width: 35px;
                height: 35px;
            }
        }
        
        @media (max-width: 380px) {
            .score-item img {
                width: 30px;
                height: 30px;
            }
            
            .score-item span {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="score-display">分数: 0</div>
        <div id="timer-display">时间: 30s</div>
        
        <div id="start-modal" class="modal">
            <div class="modal-content">
                <h1>🧨 除夕接年货 🧨</h1>
                <p>除夕到了，家家户户都在准备年货。用福袋接住从天而降的年货，把它们带回家！</p>
                
                <div class="game-rules">
                    <h2>游戏规则</h2>
                    <p>游戏时间：30秒</p>
                    <p>用手指左右移动底部的福袋，接住掉落的年货</p>
                    
                    <div class="score-item">
                        <img id="preview-item1" src="" alt="糖果" style="display:none;">
                        <div id="fallback-item1" style="width:40px;height:40px;margin-right:10px;display:flex;align-items:center;justify-content:center;font-size:30px;">🍬</div>
                        <span>糖果 1分</span>
                    </div>
                    <div class="score-item">
                        <img id="preview-item3" src="" alt="春联" style="display:none;">
                        <div id="fallback-item3" style="width:40px;height:40px;margin-right:10px;display:flex;align-items:center;justify-content:center;font-size:30px;">🧧</div>
                        <span>春联 3分</span>
                    </div>
                    <div class="score-item">
                        <img id="preview-item5" src="" alt="红包" style="display:none;">
                        <div id="fallback-item5" style="width:40px;height:40px;margin-right:10px;display:flex;align-items:center;justify-content:center;font-size:30px;">💰</div>
                        <span>红包 5分</span>
                    </div>
                    <div class="score-item">
                        <img id="preview-item10" src="" alt="元宝" style="display:none;">
                        <div id="fallback-item10" style="width:40px;height:40px;margin-right:10px;display:flex;align-items:center;justify-content:center;font-size:30px;">🏮</div>
                        <span>元宝 10分</span>
                    </div>
                </div>
                
                <button id="start-btn" class="btn">开始游戏</button>
            </div>
        </div>
        
        <div id="end-modal" class="modal hidden">
            <div class="modal-content">
                <h1>游戏结束</h1>
                <div id="final-score">0 分</div>
                <div id="result-message">正在计算您的收获...</div>
                <button id="restart-btn" class="btn">再来一局</button>
            </div>
        </div>
        
        <div id="music-toggle">
            <div class="music-icon">🎵</div>
        </div>
        
        <div id="controls-hint">← 左右移动手指控制福袋 →</div>
    </div>
    
    <audio id="bg-music" loop>
        <!-- 音乐文件 chuxibgm.mp3 或 chuxibgm.m4a -->
        <source src="chuxibgm.mp3" type="audio/mpeg">
        <source src="chuxibgm.m4a" type="audio/mp4">
        您的浏览器不支持音频播放
    </audio>
    
    <!-- 图片预加载区域 -->
    <div style="display:none;">
        <!-- 背景图片 -->
        <img id="bg-img" src="background.jpg" alt="背景">
        <!-- 接物器图片 -->
        <img id="catcher-img" src="catcher.png" alt="福袋">
        <!-- 年货图片 -->
        <img id="item1-img" src="item1.png" alt="糖果">
        <img id="item3-img" src="item3.png" alt="春联">
        <img id="item5-img" src="item5.png" alt="红包">
        <img id="item10-img" src="item10.png" alt="元宝">
    </div>
    
    <script>
        // 游戏变量
        let canvas, ctx;
        let gameRunning = false;
        let score = 0;
        let timeLeft = 30; // 改为30秒
        let timerInterval;
        let items = [];
        let catcher = {
            x: 0,
            y: 0,
            width: 120,
            height: 100,
            speed: 10
        };
        let lastTime = 0;
        let animationId;
        
        // 图片对象
        let images = {
            background: null,
            catcher: null,
            item1: null,
            item3: null,
            item5: null,
            item10: null
        };
        
        // 游戏配置
        const GAME_WIDTH = window.innerWidth > 500 ? 500 : window.innerWidth;
        const GAME_HEIGHT = window.innerHeight > 900 ? 900 : window.innerHeight;
        const ITEM_TYPES = [
            { score: 1, imageId: "item1", name: "糖果", speed: 2, probability: 0.4 },
            { score: 3, imageId: "item3", name: "春联", speed: 2.5, probability: 0.3 },
            { score: 5, imageId: "item5", name: "红包", speed: 3, probability: 0.2 },
            { score: 10, imageId: "item10", name: "元宝", speed: 3.5, probability: 0.1 }
        ];
        
        // DOM元素
        const startModal = document.getElementById('start-modal');
        const endModal = document.getElementById('end-modal');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const musicIcon = musicToggle.querySelector('.music-icon');
        
        // 图片加载完成计数器
        let imagesLoaded = 0;
        const totalImages = 6; // catcher + 4种物品 + background
        
        // 加载图片
        function loadImages() {
            const imageElements = document.querySelectorAll('img');
            
            imageElements.forEach(img => {
                // 为每个图片设置onload事件
                img.onload = () => {
                    imagesLoaded++;
                    console.log(`图片加载成功: ${img.id}`);
                    
                    // 将图片存储到images对象中
                    const id = img.id.replace('-img', '');
                    if (id in images) {
                        images[id] = img;
                        
                        // 如果是年货图片，也设置到弹窗预览中
                        if (id.startsWith('item')) {
                            const previewId = 'preview-' + id;
                            const previewImg = document.getElementById(previewId);
                            if (previewImg) {
                                previewImg.src = img.src;
                                previewImg.style.display = 'block';
                                // 隐藏fallback
                                const fallbackId = 'fallback-' + id;
                                const fallbackDiv = document.getElementById(fallbackId);
                                if (fallbackDiv) {
                                    fallbackDiv.style.display = 'none';
                                }
                            }
                        }
                    }
                    
                    // 所有图片加载完成后初始化游戏
                    if (imagesLoaded >= totalImages) {
                        console.log("所有图片加载完成");
                        initGame();
                    }
                };
                
                img.onerror = () => {
                    imagesLoaded++;
                    console.warn(`图片加载失败: ${img.src}`);
                    
                    // 即使图片加载失败，也继续初始化游戏
                    if (imagesLoaded >= totalImages) {
                        console.log("图片加载完成（部分失败）");
                        initGame();
                    }
                };
            });
            
            // 如果图片较少，确保游戏能初始化
            setTimeout(() => {
                if (!gameRunning && imagesLoaded < totalImages) {
                    console.log("部分图片加载超时，继续初始化");
                    initGame();
                }
            }, 3000);
        }
        
        // 初始化游戏
        function initGame() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            
            // 设置画布尺寸
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            
            // 初始化接物器位置
            catcher.x = (GAME_WIDTH - catcher.width) / 2;
            catcher.y = GAME_HEIGHT - catcher.height - 20;
            
            // 事件监听
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', restartGame);
            
            // 音乐控制
            musicToggle.addEventListener('click', toggleMusic);
            
            // 触摸/鼠标控制
            setupControls();
            
            // 绘制初始游戏界面
            drawBackground();
            drawCatcher();
            
            // 尝试自动播放音乐
            try {
                bgMusic.volume = 0.7;
                bgMusic.play().then(() => {
                    musicIcon.textContent = "🎵";
                }).catch(e => {
                    console.log("自动播放被阻止，需要用户交互");
                    musicIcon.textContent = "🔇";
                });
            } catch (e) {
                console.log("音乐播放错误:", e);
            }
            
            console.log("游戏初始化完成，可以点击开始按钮");
        }
        
        // 设置控制
        function setupControls() {
            let touchStartX = 0;
            let catcherStartX = 0;
            
            // 鼠标控制
            canvas.addEventListener('mousemove', (e) => {
                if (!gameRunning) return;
                
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                
                catcher.x = mouseX - catcher.width / 2;
                
                // 限制在画布内
                if (catcher.x < 0) catcher.x = 0;
                if (catcher.x + catcher.width > GAME_WIDTH) {
                    catcher.x = GAME_WIDTH - catcher.width;
                }
            });
            
            // 触摸控制
            canvas.addEventListener('touchstart', (e) => {
                if (!gameRunning) return;
                
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                touchStartX = touch.clientX - rect.left;
                catcherStartX = catcher.x;
            });
            
            canvas.addEventListener('touchmove', (e) => {
                if (!gameRunning) return;
                
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const touchX = touch.clientX - rect.left;
                const deltaX = touchX - touchStartX;
                
                catcher.x = catcherStartX + deltaX;
                
                // 限制在画布内
                if (catcher.x < 0) catcher.x = 0;
                if (catcher.x + catcher.width > GAME_WIDTH) {
                    catcher.x = GAME_WIDTH - catcher.width;
                }
            });
        }
        
        // 绘制背景
        function drawBackground() {
            // 如果有背景图片，使用背景图片
            if (images.background && images.background.complete) {
                // 绘制背景图片，适应画布大小
                ctx.drawImage(images.background, 0, 0, GAME_WIDTH, GAME_HEIGHT);
            } else {
                // 否则使用喜庆的渐变背景
                const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                gradient.addColorStop(0, "#ff4d4d");
                gradient.addColorStop(0.5, "#ff9966");
                gradient.addColorStop(1, "#ffcc00");
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                
                // 绘制一些装饰性元素
                drawDecorations();
            }
        }
        
        // 绘制装饰
        function drawDecorations() {
            // 灯笼装饰
            ctx.fillStyle = "#ff5252";
            ctx.beginPath();
            ctx.ellipse(50, 100, 30, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = "#ffeb3b";
            ctx.beginPath();
            ctx.ellipse(50, 100, 20, 30, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = "#ff5252";
            ctx.beginPath();
            ctx.ellipse(GAME_WIDTH - 50, 100, 30, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = "#ffeb3b";
            ctx.beginPath();
            ctx.ellipse(GAME_WIDTH - 50, 100, 20, 30, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 顶部装饰
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(0, 0, GAME_WIDTH, 10);
            
            // 底部装饰
            ctx.fillStyle = "#ff9900";
            ctx.fillRect(0, GAME_HEIGHT - 10, GAME_WIDTH, 10);
            
            // 飘落的红色花瓣效果
            for (let i = 0; i < 8; i++) {
                const x = (Date.now() / 50 + i * 80) % GAME_WIDTH;
                const y = (Date.now() / 40 + i * 40) % GAME_HEIGHT;
                
                ctx.fillStyle = i % 2 === 0 ? "#ff6666" : "#ffcc00";
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制接物器 (福袋)
        function drawCatcher() {
            // 如果有福袋图片，使用图片
            if (images.catcher && images.catcher.complete) {
                ctx.drawImage(images.catcher, catcher.x, catcher.y, catcher.width, catcher.height);
            } else {
                // 否则绘制一个简单的福袋图形
                ctx.fillStyle = "#ff3333";
                ctx.beginPath();
                ctx.roundRect(catcher.x, catcher.y, catcher.width, catcher.height, 20);
                ctx.fill();
                
                // 福袋口
                ctx.fillStyle = "#ff9900";
                ctx.beginPath();
                ctx.roundRect(catcher.x, catcher.y, catcher.width, 20, 10);
                ctx.fill();
                
                // 福字
                ctx.fillStyle = "#ffeb3b";
                ctx.font = "bold 50px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("福", catcher.x + catcher.width / 2, catcher.y + catcher.height / 2);
            }
            
            // 阴影效果
            ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 5;
            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
        }
        
        // 创建掉落物品
        function createItem() {
            // 根据概率随机选择物品类型
            const rand = Math.random();
            let cumulativeProb = 0;
            let selectedType;
            
            for (const type of ITEM_TYPES) {
                cumulativeProb += type.probability;
                if (rand <= cumulativeProb) {
                    selectedType = type;
                    break;
                }
            }
            
            const item = {
                x: Math.random() * (GAME_WIDTH - 60) + 30,
                y: -60,
                width: 60,
                height: 60,
                score: selectedType.score,
                imageId: selectedType.imageId,
                name: selectedType.name,
                speed: selectedType.speed,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.1
            };
            
            items.push(item);
        }
        
        // 绘制物品
        function drawItem(item) {
            const img = images[item.imageId];
            
            ctx.save();
            ctx.translate(item.x + item.width / 2, item.y + item.height / 2);
            ctx.rotate(item.rotation);
            
            // 如果有物品图片，使用图片
            if (img && img.complete) {
                ctx.drawImage(img, -item.width/2, -item.height/2, item.width, item.height);
            } else {
                // 否则根据分数绘制不同颜色的形状
                if (item.score === 1) {
                    // 糖果 - 圆形
                    ctx.fillStyle = "#ffcc00";
                    ctx.beginPath();
                    ctx.arc(0, 0, item.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 糖果条纹
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(-item.width / 2, -5, item.width, 10);
                    ctx.fillRect(-5, -item.height / 2, 10, item.height);
                } else if (item.score === 3) {
                    // 春联 - 矩形
                    ctx.fillStyle = "#ff3333";
                    ctx.fillRect(-item.width / 2, -item.height / 2, item.width, item.height);
                    
                    // 文字
                    ctx.fillStyle = "#ffeb3b";
                    ctx.font = "bold 20px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("春", 0, 0);
                } else if (item.score === 5) {
                    // 红包 - 矩形加圆形边角
                    ctx.fillStyle = "#ff3333";
                    ctx.beginPath();
                    ctx.roundRect(-item.width / 2, -item.height / 2, item.width, item.height, 10);
                    ctx.fill();
                    
                    // 金色边框
                    ctx.strokeStyle = "#ffeb3b";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // 福字
                    ctx.fillStyle = "#ffeb3b";
                    ctx.font = "bold 24px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("福", 0, 0);
                } else if (item.score === 10) {
                    // 元宝 - 椭圆形
                    ctx.fillStyle = "#ffcc00";
                    ctx.beginPath();
                    ctx.ellipse(0, 0, item.width / 2, item.height / 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 高光
                    const gradient = ctx.createRadialGradient(-10, -10, 5, 0, 0, 25);
                    gradient.addColorStop(0, "rgba(255, 255, 255, 0.8)");
                    gradient.addColorStop(1, "rgba(255, 255, 255, 0)");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(-10, -10, 15, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            ctx.restore();
            
            // 分数标签
            ctx.fillStyle = "#fff";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillText(item.score, item.x + item.width / 2, item.y + item.height + 5);
        }
        
        // 更新物品位置
        function updateItems() {
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                
                // 更新位置
                item.y += item.speed;
                item.rotation += item.rotationSpeed;
                
                // 检测是否被接住
                if (
                    item.y + item.height >= catcher.y &&
                    item.y <= catcher.y + catcher.height &&
                    item.x + item.width >= catcher.x &&
                    item.x <= catcher.x + catcher.width
                ) {
                    // 接住物品，增加分数
                    score += item.score;
                    scoreDisplay.textContent = `分数: ${score}`;
                    
                    // 移除物品
                    items.splice(i, 1);
                    
                    // 创建接住效果
                    createCatchEffect(item.x + item.width / 2, item.y + item.height / 2, item.score);
                    continue;
                }
                
                // 移除超出屏幕的物品
                if (item.y > GAME_HEIGHT + 100) {
                    items.splice(i, 1);
                }
            }
        }
        
        // 创建接住效果
        function createCatchEffect(x, y, points) {
            ctx.save();
            ctx.font = "bold 30px Arial";
            ctx.fillStyle = points >= 10 ? "#ffcc00" : points >= 5 ? "#ff9800" : "#ff3333";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`+${points}`, x, y - 30);
            ctx.restore();
        }
        
        // 游戏主循环
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            // 清空画布
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // 绘制背景
            drawBackground();
            
            // 更新和绘制物品
            updateItems();
            items.forEach(item => drawItem(item));
            
            // 绘制接物器
            drawCatcher();
            
            // 随机生成新物品 (根据时间调整生成速度，后期加快)
            const spawnRate = timeLeft > 15 ? 0.04 : 0.06;
            if (Math.random() < spawnRate) {
                createItem();
            }
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // 开始游戏
        function startGame() {
            console.log("开始游戏按钮被点击");
            
            // 重置游戏状态
            score = 0;
            timeLeft = 30;
            items = [];
            gameRunning = true;
            
            // 更新显示
            scoreDisplay.textContent = `分数: ${score}`;
            timerDisplay.textContent = `时间: ${timeLeft}s`;
            
            // 隐藏开始弹窗
            startModal.classList.add('hidden');
            
            // 开始计时器
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `时间: ${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            
            // 开始游戏循环
            lastTime = performance.now();
            animationId = requestAnimationFrame(gameLoop);
            
            // 确保音乐播放
            try {
                if (bgMusic.paused) {
                    bgMusic.play();
                    musicIcon.textContent = "🎵";
                }
            } catch (e) {
                console.log("音乐播放错误:", e);
            }
        }
        
        // 结束游戏
        function endGame() {
            console.log("游戏结束");
            gameRunning = false;
            
            // 清除计时器
            clearInterval(timerInterval);
            
            // 停止游戏循环
            cancelAnimationFrame(animationId);
            
            // 显示最终分数
            finalScoreDisplay.textContent = `${score} 分`;
            
            // 显示评价 (调整分数阈值，因为时间延长到30秒)
            let message = "";
            if (score >= 400) {
                message = "🎉 福星高照！您接到的年货堆成山了！";
            } else if (score >= 250) {
                message = "✨ 满载而归！今年过年不愁吃喝了！";
            } else if (score >= 150) {
                message = "👍 收获颇丰！除夕夜可以好好庆祝了！";
            } else if (score >= 80) {
                message = "😊 小有收获！过个温馨的除夕夜没问题！";
            } else {
                message = "🤗 再接再厉！明年一定会更好！";
            }
            
            resultMessage.textContent = message;
            
            // 显示结束弹窗
            endModal.classList.remove('hidden');
        }
        
        // 重新开始游戏
        function restartGame() {
            console.log("重新开始游戏");
            
            // 隐藏结束弹窗
            endModal.classList.add('hidden');
            
            // 重新开始游戏
            startGame();
        }
        
        // 切换音乐
        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicIcon.textContent = "🎵";
            } else {
                bgMusic.pause();
                musicIcon.textContent = "🔇";
            }
        }
        
        // 添加圆角矩形方法
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
            if (width < 2 * radius) radius = width / 2;
            if (height < 2 * radius) radius = height / 2;
            
            this.beginPath();
            this.moveTo(x + radius, y);
            this.arcTo(x + width, y, x + width, y + height, radius);
            this.arcTo(x + width, y + height, x, y + height, radius);
            this.arcTo(x, y + height, x, y, radius);
            this.arcTo(x, y, x + width, y, radius);
            this.closePath();
            return this;
        };
        
        // 页面加载完成后开始加载图片
        window.addEventListener('load', loadImages);
        
        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas || e.target === document.body) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // 窗口大小变化时重新调整
        window.addEventListener('resize', () => {
            if (canvas && ctx) {
                canvas.width = window.innerWidth > 500 ? 500 : window.innerWidth;
                canvas.height = window.innerHeight > 900 ? 900 : window.innerHeight;
                drawBackground();
                drawCatcher();
            }
        });
    </script>
</body>
</html>
