<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>春分 · 万物生长</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    background:url("背景.jpg") no-repeat center;
    background-size:cover;
    color:#000;
}

/* 页面 */
.page{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.active{display:flex;}

/* 标题 */
.title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
}
.subtitle{
    font-size:14px;
    margin-bottom:30px;
}

/* 按钮 */
.btn{
    padding:10px 20px;
    border-radius:25px;
    background:#6bbf59;
    color:#fff;
    border:none;
    margin:8px;
}

/* 卡片统一 */
.card{
    width:85%;
    max-width:380px;
    padding:22px;
    background:url("文本框.png") no-repeat center;
    background-size:cover;
    border-radius:20px;
    text-align:left;
    line-height:1.9;
    font-size:15px;
}

/* 翻转卡 */
.flip{
    width:220px;
    height:160px;
    perspective:1000px;
}
.flip-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:0.6s;
}
.flip.active .flip-inner{
    transform:rotateY(180deg);
}
.flip-front,.flip-back{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    background:url("文本框.png") center/cover;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    text-align:center;
}
.flip-back{
    transform:rotateY(180deg);
}

/* 花瓣 */
.petal{
    position:fixed;
    top:-50px;
    width:20px;
    animation:fall linear infinite;
}
@keyframes fall{
    to{transform:translateY(110vh) rotate(360deg);}
}

/* 音乐 */
.music{
    position:fixed;
    top:20px;
    right:20px;
    z-index:10;
    background:#fff;
    border-radius:50%;
    width:40px;
    height:40px;
    display:flex;
    justify-content:center;
    align-items:center;
}
</style>
</head>

<body>

<audio id="bgm" src="chunfenbgm.mp3" autoplay loop></audio>
<div class="music" onclick="toggleMusic()">♫</div>

<!-- 花瓣 -->
<script>
for(let i=0;i<15;i++){
    let p=document.createElement("img");
    p.src="花瓣.png";
    p.className="petal";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(p);
}
</script>

<!-- 首页 -->
<div class="page active" id="p1">
    <div class="title">春分</div>
    <div class="subtitle">昼夜均分 · 万物生长</div>
    <button class="btn" onclick="next(2)">开启春日之旅</button>
</div>

<!-- 页面2 节气知识 -->
<div class="page" id="p2">
    <div class="title">节气知识</div>
    <div class="card" id="cardText">
        春分，是二十四节气中的第四个节气，也是春季的中点。
        此时太阳直射赤道，昼夜几乎相等，寒暑趋于平衡。
        随着气温持续回升，大地逐渐摆脱冬日的沉寂，
        草木萌发、百花渐开，自然界进入一年中最富生命力的阶段。
    </div>
    <button class="btn" onclick="changeCard()">换一条</button>
    <div>
        <button class="btn" onclick="next(1)">上一页</button>
        <button class="btn" onclick="next(3)">下一页</button>
    </div>
</div>

<!-- 页面3 习俗 -->
<div class="page" id="p3">
    <div class="title">春分习俗</div>
    <div class="flip" onclick="flipCard(this)">
        <div class="flip-inner">
            <div class="flip-front">点击查看习俗</div>
            <div class="flip-back">
                立蛋、踏青、放风筝<br>
                在这一天，人们走向自然，<br>
                感受春光与生机。
            </div>
        </div>
    </div>
    <div>
        <button class="btn" onclick="next(2)">上一页</button>
        <button class="btn" onclick="next(4)">下一页</button>
    </div>
</div>

<!-- 页面4 诗意 -->
<div class="page" id="p4">
    <div class="title">诗意春分</div>
    <div class="card">
        春分雨脚落声微，柳岸斜风带客归。<br><br>
        此时天地平衡，万物舒展，<br>
        一半是温柔春光，一半是盎然生机。<br><br>
        在春分的时节里，时间仿佛变得缓慢而温和，
        让人沉浸在自然与诗意的交织之中。
    </div>
    <button class="btn" onclick="next(3)">上一页</button>
</div>

<script>
// 音乐
document.addEventListener("click",()=>{
    document.getElementById("bgm").play();
});
function toggleMusic(){
    let a=document.getElementById("bgm");
    a.paused?a.play():a.pause();
}

// 翻页
function next(n){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("p"+n).classList.add("active");
}

// 卡片内容（已扩写）
const texts=[
"春分不仅是时间上的中点，更象征着自然界阴阳平衡的状态。此时阳光温和而不炽烈，气候宜人，是一年中最舒适的时段之一。",
"在春分前后，农田进入繁忙阶段。农民开始大规模播种与管理作物，大地在此刻展现出强大的生命力与生产力。",
"从生态角度看，春分意味着生物活动显著增强，昆虫、鸟类与植物都进入活跃期，形成完整而生动的春日生态画卷。"
];
let i=0;
function changeCard(){
    i=(i+1)%texts.length;
    document.getElementById("cardText").innerText=texts[i];
}

// 翻卡
function flipCard(el){
    el.classList.toggle("active");
}
</script>

</body>
</html>
