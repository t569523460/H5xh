<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春分</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:url("背景.jpg") no-repeat center;
    background-size:cover;
    font-family:Arial;
    color:#000;
}

/* 页面 */
.page{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
}
.active{display:block;}

/* 顶部标题 */
.header{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
}
.title{
    font-size:28px;
    font-weight:bold;
}
.subtitle{
    font-size:14px;
    margin-top:5px;
}

/* 中间内容 */
.content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:92%;
    display:flex;
    justify-content:center;
}

/* 文本框 */
.card{
    width:100%;
    max-width:420px;
    padding:25px;
    background:url("文本框.png") no-repeat center;
    background-size:100% 100%; /* 修复裁切 */
    border-radius:20px;
    font-size:15px;
    line-height:1.7;
}

/* 底部按钮 */
.footer{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
}
.btn{
    padding:10px 20px;
    border-radius:25px;
    background:#6bbf59;
    color:#fff;
    border:none;
    margin:5px;
}

/* 翻卡 */
.flip{
    width:240px;
    height:180px;
    perspective:1000px;
}
.flip-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:0.6s;
}
.flip.active .flip-inner{
    transform:rotateY(180deg);
}
.flip-front,.flip-back{
    position:absolute;
    width:100%;
    height:100%;
    background:url("文本框.png") center/100% 100%;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:15px;
}
.flip-back{
    transform:rotateY(180deg);
}

/* 花瓣 */
.petal{
    position:fixed;
    top:-50px;
    width:20px;
    animation:fall linear infinite;
}
@keyframes fall{
    to{transform:translateY(110vh) rotate(360deg);}
}

/* 音乐 */
.music{
    position:fixed;
    top:20px;
    right:20px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
}
</style>
</head>

<body>

<audio id="bgm" src="chunfenbgm.mp3" autoplay loop></audio>
<div class="music" onclick="toggleMusic()">♫</div>

<!-- 花瓣 -->
<script>
for(let i=0;i<15;i++){
    let p=document.createElement("img");
    p.src="花瓣.png";
    p.className="petal";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(p);
}
</script>

<!-- 首页 -->
<div class="page active" id="p1">
    <div class="header">
        <div class="title">春分</div>
        <div class="subtitle">昼夜均分 · 万物生长</div>
    </div>
    <div class="footer">
        <button class="btn" onclick="next(2)">开启春日之旅</button>
    </div>
</div>

<!-- 节气知识 -->
<div class="page" id="p2">
    <div class="header">
        <div class="title">节气知识</div>
    </div>

    <div class="content">
        <div class="card" id="cardText">
            春分是春季的中点，此时昼夜几乎相等，寒暑平衡。
            气温持续回升，大地逐渐复苏，草木萌发、百花初绽，
            自然界呈现出一派生机盎然的景象。
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="changeCard()">换一条</button><br>
        <button class="btn" onclick="next(1)">上一页</button>
        <button class="btn" onclick="next(3)">下一页</button>
    </div>
</div>

<!-- 习俗 -->
<div class="page" id="p3">
    <div class="header">
        <div class="title">春分习俗</div>
    </div>

    <div class="content">
        <div class="flip" onclick="flipCard(this)">
            <div class="flip-inner">
                <div class="flip-front">点击查看春分习俗</div>
                <div class="flip-back">
                    立蛋、踏青、放风筝<br>
                    人们走进自然，感受春光与生机
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="next(2)">上一页</button>
        <button class="btn" onclick="next(4)">下一页</button>
    </div>
</div>

<!-- 诗意 -->
<div class="page" id="p4">
    <div class="header">
        <div class="title">诗意春分</div>
    </div>

    <div class="content">
        <div class="card">
            春分雨脚落声微，柳岸斜风带客归。<br>
            万物在此刻舒展生长，一半春光，一半温柔。<br>
            时间仿佛也慢了下来，让人沉浸在春日的气息之中。
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="next(3)">上一页</button>
    </div>
</div>

<script>
// 音乐
document.addEventListener("click",()=>{
    document.getElementById("bgm").play();
});
function toggleMusic(){
    let a=document.getElementById("bgm");
    a.paused?a.play():a.pause();
}

// 翻页
function next(n){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("p"+n).classList.add("active");
}

// 内容切换
const texts=[
"春分象征昼夜平衡，是自然界阴阳调和的重要节点，此时气候温和宜人。",
"春分前后农事繁忙，大量作物进入播种期，是农业生产的重要阶段。",
"生态系统逐渐活跃，动植物开始繁衍生长，形成完整的春日景象。"
];
let i=0;
function changeCard(){
    i=(i+1)%texts.length;
    document.getElementById("cardText").innerText=texts[i];
}

// 翻卡
function flipCard(el){
    el.classList.toggle("active");
}
</script>

</body>
</html>
