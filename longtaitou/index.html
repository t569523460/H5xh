<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙抬头H5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family: "PingFang SC";
    overflow:hidden;
    background:#000;
}

/* 容器 */
.container{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
}

/* 页面 */
.page{
    width:100%;
    height:100vh;
    position:absolute;
    top:0;
    left:0;
    background:url("bg-main.jpg") no-repeat center/cover;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:transform 0.6s ease;
}

/* 遮罩 */
.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
}

/* 内容 */
.content{
    position:relative;
    color:#fff;
    text-align:center;
    padding:20px;
}

/* 标题 */
h1{
    font-size:34px;
    letter-spacing:4px;
    margin-bottom:10px;
}

.text{
    font-size:16px;
    line-height:1.8;
    opacity:0.9;
}

/* 装饰卡片 */
.card{
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

/* 抽签盒 */
.box{
    width:160px;
    margin-top:30px;
    transition:transform 0.2s;
}

.shake{
    animation:shake 0.4s ease;
}

@keyframes shake{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

/* 签展示 */
.result{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.7);
}

.paper{
    width:200px;
    position:relative;
}

.words{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    writing-mode:vertical-rl;
    font-size:20px;
    letter-spacing:6px;
}
</style>
</head>

<body>

<div class="container" id="container">

<!-- 第1页 -->
<div class="page" style="transform:translateY(0)">
<div class="overlay"></div>
<div class="content">
<h1>二月二 · 龙抬头</h1>
<p class="text">春回大地 万物生长<br>一切从“头”开始</p>
</div>
</div>

<!-- 第2页 -->
<div class="page" style="transform:translateY(100%)">
<div class="overlay"></div>
<div class="content">
<div class="card">
龙抬头源于古代星象崇拜，<br>
东方苍龙七宿在此日“抬头”，<br>
象征雨水将至、春耕开启。
</div>
</div>
</div>

<!-- 第3页 -->
<div class="page" style="transform:translateY(200%)">
<div class="overlay"></div>
<div class="content">
<div class="card">
民间有剃头、吃龙食等习俗，<br>
寓意鸿运当头、风调雨顺。<br>
这一日，人们祈福纳吉。
</div>
</div>
</div>

<!-- 第4页 抽签 -->
<div class="page" style="transform:translateY(300%)">
<div class="overlay"></div>
<div class="content">
<p>点击抽取今日运势</p>
<img src="lottery-box.png" class="box" id="box">
</div>
</div>

</div>

<!-- 抽签结果 -->
<div class="result" id="result">
    <div>
        <img src="lottery-paper.png" class="paper">
        <div class="words" id="words"></div>
    </div>
</div>

<script>
let current=0;
let pages=document.querySelectorAll(".page");

/* 滑动 */
let startY=0;
document.addEventListener("touchstart",e=>{
    startY=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
    let endY=e.changedTouches[0].clientY;
    let diff=startY-endY;

    if(diff>50 && current<pages.length-1){
        current++;
    }else if(diff<-50 && current>0){
        current--;
    }
    update();
});

function update(){
    pages.forEach((p,i)=>{
        p.style.transform=`translateY(${(i-current)*100}%)`;
    });
}

/* 抽签 */
const texts=[
"万事顺遂","鸿运当头","平安喜乐","顺风顺水",
"心想事成","福运绵长","吉星高照","诸事皆宜"
];

let box=document.getElementById("box");
let result=document.getElementById("result");
let words=document.getElementById("words");

box.onclick=()=>{
    box.classList.add("shake");

    setTimeout(()=>{
        box.classList.remove("shake");

        let t=texts[Math.floor(Math.random()*texts.length)];

        // 左右排布
        words.innerHTML = t.split("").join("<br>");

        result.style.display="flex";
    },400);
};

/* 点击关闭 */
result.onclick=()=>{
    result.style.display="none";
};
</script>

</body>
</html>
