<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙抬头H5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"PingFang SC";
    overflow:hidden;
}

/* 页面容器 */
.page{
    width:100%;
    height:100vh;
    position:absolute;
    top:0;
    left:0;
    background:url("bg-main.jpg") no-repeat center/cover;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:transform 0.6s;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
}

/* 上半部分 */
.top{
    position:absolute;
    top:15%;
    width:100%;
    text-align:center;
    color:#fff;
    padding:0 20px;
}

/* 下半部分 */
.bottom{
    position:absolute;
    bottom:10%;
    width:100%;
    display:flex;
    justify-content:center;
}

.bottom img{
    width:70%;
    border-radius:12px;
}

/* 标题 */
h1{font-size:32px;margin-bottom:10px;}
p{font-size:16px;line-height:1.8;}

/* 抽签盒 */
.box{
    width:160px;
    cursor:pointer;
}

/* 强化晃动 */
.shake{
    animation:shake 0.8s ease;
}

@keyframes shake{
    0%{transform:translateY(0)}
    20%{transform:translateY(-20px)}
    40%{transform:translateY(15px)}
    60%{transform:translateY(-15px)}
    80%{transform:translateY(10px)}
    100%{transform:translateY(0)}
}

/* 抽签结果 */
.result{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.7);
}

.paper{
    width:220px;
    position:relative;
}

/* 对联排版 */
.words{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:20px;
    font-size:20px;
}

.col{
    display:flex;
    flex-direction:column;
    align-items:center;
}
</style>
</head>

<body>

<!-- 页面 -->
<div class="page" style="transform:translateY(0)">
<div class="overlay"></div>
<div class="top">
<h1>二月二 · 龙抬头</h1>
<p>春回大地 万物生长 一切从头开始</p>
</div>
</div>

<div class="page" style="transform:translateY(100%)">
<div class="overlay"></div>
<div class="top">
<p>龙抬头源于星宿运行，象征苍龙抬首<br>主降雨水，万物复苏</p>
</div>
<div class="bottom">
<img src="img1.jpg">
</div>
</div>

<div class="page" style="transform:translateY(200%)">
<div class="overlay"></div>
<div class="top">
<p>民间有剃头、吃龙食习俗<br>寓意鸿运当头、福气降临</p>
</div>
<div class="bottom">
<img src="img2.jpg">
</div>
</div>

<div class="page" style="transform:translateY(300%)">
<div class="overlay"></div>
<div class="top">
<p>点击抽取今日运势</p>
</div>
<div class="bottom" style="bottom:30%">
<img src="lottery-box.png" class="box" id="box">
</div>
</div>

<!-- 抽签结果 -->
<div class="result" id="result">
    <div>
        <img src="lottery-paper.png" class="paper">
        <div class="words" id="words"></div>
    </div>
</div>

<script>
let pages=document.querySelectorAll(".page");
let current=0;

/* 更新位置 */
function update(){
    pages.forEach((p,i)=>{
        p.style.transform=`translateY(${(i-current)*100}%)`;
    });
}

/* 手机滑动 */
let startY=0;
document.addEventListener("touchstart",e=>{
    startY=e.touches[0].clientY;
});
document.addEventListener("touchend",e=>{
    let diff=startY-e.changedTouches[0].clientY;
    handleMove(diff);
});

/* 电脑拖拽 */
let isDown=false;
let mouseStart=0;

document.addEventListener("mousedown",e=>{
    isDown=true;
    mouseStart=e.clientY;
});
document.addEventListener("mouseup",e=>{
    if(!isDown) return;
    let diff=mouseStart-e.clientY;
    handleMove(diff);
    isDown=false;
});

/* 统一处理 */
function handleMove(diff){
    if(diff>50 && current<pages.length-1) current++;
    else if(diff<-50 && current>0) current--;
    update();
}

/* 抽签 */
const texts=[
["万事顺遂","好运常在"],
["鸿运当头","福气满满"],
["平安喜乐","顺遂无忧"],
["吉星高照","诸事皆宜"]
];

let box=document.getElementById("box");
let result=document.getElementById("result");
let words=document.getElementById("words");

box.onclick=()=>{
    box.classList.add("shake");

    setTimeout(()=>{
        box.classList.remove("shake");

        let t=texts[Math.floor(Math.random()*texts.length)];

        words.innerHTML=`
        <div class="col">${t[0].split("").map(i=>`<span>${i}</span>`).join("")}</div>
        <div class="col">${t[1].split("").map(i=>`<span>${i}</span>`).join("")}</div>
        `;

        result.style.display="flex";
    },800);
};

/* 点击关闭 */
result.onclick=()=>{
    result.style.display="none";
};
</script>

</body>
</html>
