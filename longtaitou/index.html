<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙抬头H5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"PingFang SC";
    overflow:hidden;
}

/* 页面 */
.page{
    width:100%;
    height:100vh;
    position:absolute;
    top:0;
    left:0;
    background:url("bg-main.jpg") no-repeat center/cover;
    transition:transform 0.6s;
}

/* 遮罩 */
.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
}

/* 上半部分 */
.top{
    position:absolute;
    top:12%;
    width:100%;
    text-align:center;
    color:#fff;
    padding:0 30px;
}

/* 下半部分（图片上移） */
.bottom{
    position:absolute;
    bottom:25%;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    display:flex;
    justify-content:center;
}

.bottom img{
    width:70%;
    max-width:320px;
    border-radius:12px;
}

/* 标题 */
h1{font-size:32px;margin-bottom:10px;}
p{font-size:16px;line-height:1.9;}

/* 滑动提示 */
.tip{
    position:absolute;
    bottom:15%;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:14px;
    opacity:0.8;
    animation:float 1.5s infinite;
}

@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(8px)}
    100%{transform:translateY(0)}
}

/* 抽签盒 */
.box{
    width:130px;
    margin-top:40px;
    cursor:pointer;
}

/* 晃动 */
.shake{
    animation:shake 0.8s ease;
}

@keyframes shake{
    0%{transform:translateY(0)}
    20%{transform:translateY(-20px)}
    40%{transform:translateY(15px)}
    60%{transform:translateY(-15px)}
    80%{transform:translateY(10px)}
    100%{transform:translateY(0)}
}

/* 抽签结果 */
.result{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.7);
}

.paper{
    width:220px;
    position:relative;
}

/* 签文竖排 */
.words{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:22px;
}

.word{
    margin:2px 0;
}

/* 第4字后间距 */
.word:nth-child(4){
    margin-bottom:12px;
}

/* 音乐按钮 */
#audioBtn{
    position:fixed;
    top:20px;
    right:20px;
    width:40px;
    height:40px;
    background:rgba(255,255,255,0.5);
    border-radius:50%;
    text-align:center;
    line-height:40px;
    font-size:20px;
    color:#000;
    cursor:pointer;
    z-index:999;
}
#audioBtn.playing{
    background:rgba(255,255,255,0.9);
}
</style>
</head>

<body>

<!-- 第1页 -->
<div class="page" style="transform:translateY(0)">
<div class="overlay"></div>
<div class="top">
<h1>二月二 · 龙抬头</h1>
<p>春回大地 万物生长</p>
</div>
<div class="tip">↓ 向下滑动</div>
</div>

<!-- 第2页 -->
<div class="page" style="transform:translateY(100%)">
<div class="overlay"></div>
<div class="top">
<p>
龙抬头源于古代天文星象变化，<br>
东方苍龙七宿逐渐显现于夜空，<br>
象征“龙抬首”的重要时刻。<br><br>
古人以此判断节气更替，<br>
认为此后雨水渐增、万物复苏，<br>
标志春耕时节正式开启。
</p>
</div>
<div class="bottom">
<img src="img1.jpg">
</div>
<div class="tip">↓ 向下滑动</div>
</div>

<!-- 第3页 -->
<div class="page" style="transform:translateY(200%)">
<div class="overlay"></div>
<div class="top">
<p>
二月二在民间寓意吉祥开端，<br>
人们会理发“剃龙头”，<br>
寄托鸿运当头的美好愿望。<br><br>
同时还有吃龙须面、春饼等习俗，<br>
象征纳福迎祥、风调雨顺，<br>
表达对新一年生活的期待。
</p>
</div>
<div class="bottom">
<img src="img2.jpg">
</div>
<div class="tip">↓ 向下滑动</div>
</div>

<!-- 第4页 -->
<div class="page" style="transform:translateY(300%)">
<div class="overlay"></div>
<div class="top">
<p>点击抽取今日运势</p>
</div>
<div class="bottom" style="bottom:20%;">
<img src="lottery-box.png" class="box" id="box">
</div>
</div>

<!-- 抽签 -->
<div class="result" id="result">
<div>
<img src="lottery-paper.png" class="paper">
<div class="words" id="words"></div>
</div>
</div>

<!-- 背景音乐 -->
<audio id="bgm" src="long.mp3" loop autoplay></audio>
<div id="audioBtn">🎵</div>

<script>
let pages=document.querySelectorAll(".page");
let current=0;

function update(){
    pages.forEach((p,i)=>{
        p.style.transform=`translateY(${(i-current)*100}%)`;
    });
}

/* 滑动 */
let startY=0;
document.addEventListener("touchstart",e=>{ startY=e.touches[0].clientY; });
document.addEventListener("touchend",e=>{ handleMove(startY-e.changedTouches[0].clientY); });

/* 电脑拖拽 */
let isDown=false,start=0;
document.addEventListener("mousedown",e=>{ isDown=true; start=e.clientY; });
document.addEventListener("mouseup",e=>{
    if(!isDown) return;
    handleMove(start-e.clientY);
    isDown=false;
});

function handleMove(diff){
    if(diff>50 && current<pages.length-1) current++;
    else if(diff<-50 && current>0) current--;
    update();
}

/* 抽签 */
const texts=[
"万事顺遂好运常在",
"鸿运当头福气满满",
"平安喜乐顺遂无忧",
"吉星高照诸事皆宜"
];

let box=document.getElementById("box");
let result=document.getElementById("result");
let words=document.getElementById("words");

box.onclick=()=>{
    box.classList.add("shake");
    setTimeout(()=>{
        box.classList.remove("shake");
        let t=texts[Math.floor(Math.random()*texts.length)];
        words.innerHTML = t.split("").map(c=>`<div class="word">${c}</div>`).join("");
        result.style.display="flex";
    },800);
};
result.onclick=()=>{ result.style.display="none"; };

/* 音乐控制 */
const bgm=document.getElementById("bgm");
const audioBtn=document.getElementById("audioBtn");
audioBtn.onclick=()=>{
    if(bgm.paused){
        bgm.play();
        audioBtn.classList.add("playing");
    }else{
        bgm.pause();
        audioBtn.classList.remove("playing");
    }
};
</script>

</body>
</html>
