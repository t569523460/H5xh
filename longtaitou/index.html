<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙抬头H5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:"PingFang SC";
    overflow:hidden;
}

/* 页面 */
.page{
    width:100%;
    height:100vh;
    position:absolute;
    background:url("bg-main.jpg") no-repeat center/cover;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform 0.6s;
}

/* 遮罩 */
.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
}

/* 内容 */
.content{
    position:relative;
    color:#fff;
    text-align:center;
    padding:20px;
    width:100%;
}

/* 标题 */
h1{
    margin-top:120px;
    font-size:34px;
}

/* 文本卡片（上移） */
.card{
    margin-top:80px;
    background:rgba(0,0,0,0.5);
    padding:18px;
    border-radius:12px;
    width:80%;
}

/* 情景图（下半部分） */
.scene{
    position:absolute;
    bottom:40px;
    width:80%;
    border-radius:12px;
}

/* 抽签提示（固定顶部） */
.tip{
    position:absolute;
    top:80px;
    color:#fff;
    font-size:16px;
}

/* 抽签盒 */
.box{
    width:160px;
    margin-top:200px;
}

/* 强烈晃动 */
.shake{
    animation:shake 0.8s ease;
}

@keyframes shake{
    0%{transform:translateY(0)}
    20%{transform:translateY(-25px)}
    40%{transform:translateY(15px)}
    60%{transform:translateY(-20px)}
    80%{transform:translateY(10px)}
    100%{transform:translateY(0)}
}

/* 签 */
.result{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.75);
}

.paper{
    width:220px;
    position:relative;
}

/* 左右排布 */
.words{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:20px;
    font-size:20px;
}

.col{
    display:flex;
    flex-direction:column;
    gap:6px;
}
</style>
</head>

<body>

<!-- 页面1 -->
<div class="page" style="transform:translateY(0)">
<div class="overlay"></div>
<div class="content">
<h1>二月二 · 龙抬头</h1>
<p style="margin-top:20px;">春启万物 万象更新</p>
</div>
</div>

<!-- 页面2 -->
<div class="page" style="transform:translateY(100%)">
<div class="overlay"></div>
<div class="content">
<div class="card">
龙抬头源于星宿变化，<br>
象征春回大地，<br>
农耕时序由此开启。
</div>
<img src="scene1.jpg" class="scene">
</div>
</div>

<!-- 页面3 -->
<div class="page" style="transform:translateY(200%)">
<div class="overlay"></div>
<div class="content">
<div class="card">
剃头、吃龙食，<br>
寓意鸿运当头，<br>
祈愿一年顺遂安康。
</div>
<img src="scene2.jpg" class="scene">
</div>
</div>

<!-- 页面4 -->
<div class="page" style="transform:translateY(300%)">
<div class="overlay"></div>
<div class="content">
<div class="tip">点击抽取今日运势</div>
<img src="lottery-box.png" class="box" id="box">
</div>
</div>

<!-- 抽签 -->
<div class="result" id="result">
    <div>
        <img src="lottery-paper.png" class="paper">
        <div class="words" id="words"></div>
    </div>
</div>

<script>
let current=0;
let pages=document.querySelectorAll(".page");

/* 手机滑动 */
let startY=0;

document.addEventListener("touchstart",e=>{
    startY=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
    let endY=e.changedTouches[0].clientY;
    handleMove(startY,endY);
});

/* 电脑拖动 */
let mouseDown=false;
let startMouseY=0;

document.addEventListener("mousedown",e=>{
    mouseDown=true;
    startMouseY=e.clientY;
});

document.addEventListener("mouseup",e=>{
    if(!mouseDown) return;
    mouseDown=false;
    handleMove(startMouseY,e.clientY);
});

/* 统一处理 */
function handleMove(start,end){
    let diff=start-end;

    if(diff>50 && current<pages.length-1){
        current++;
    }else if(diff<-50 && current>0){
        current--;
    }

    update();
}

function update(){
    pages.forEach((p,i)=>{
        p.style.transform=`translateY(${(i-current)*100}%)`;
    });
}

/* 抽签 */
const texts=[
["万事","顺遂"],
["鸿运","当头"],
["平安","喜乐"],
["顺风","顺水"],
["心想","事成"],
["吉星","高照"]
];

let box=document.getElementById("box");
let result=document.getElementById("result");
let words=document.getElementById("words");

box.onclick=()=>{
    box.classList.add("shake");

    setTimeout(()=>{
        box.classList.remove("shake");

        let t=texts[Math.floor(Math.random()*texts.length)];

        // 生成左右两列
        words.innerHTML=`
            <div class="col">
                ${t[0].split("").map(i=>`<span>${i}</span>`).join("")}
            </div>
            <div class="col">
                ${t[1].split("").map(i=>`<span>${i}</span>`).join("")}
            </div>
        `;

        result.style.display="flex";
    },800);
};

/* 关闭 */
result.onclick=()=>{
    result.style.display="none";
};
</script>

</body>
</html>
