<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雨水 · 润物无声</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 原有样式基础上修改颜色和添加雨水效果 */
        /* 颜色主题从绿色系改为蓝色/青色系 */
        :root {
            --primary-color: #2c5282;      /* 主蓝色 */
            --secondary-color: #4299e1;     /* 次蓝色 */
            --accent-color: #38b2ac;        /* 青色 */
            --light-color: #bee3f8;         /* 浅蓝色 */
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 30%, #7dd3fc 70%, #38bdf8 100%);
        }
        
        /* 动态雨点背景 */
        .rain-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            overflow: hidden;
        }
        
        .rain-drop {
            position: absolute;
            top: -20px;
            width: 1px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(56, 178, 172, 0.6));
            animation: rain-fall linear infinite;
        }
        
        .rain-drop:nth-child(odd) {
            background: linear-gradient(to bottom, transparent, rgba(66, 153, 225, 0.4));
        }
        
        .rain-splash {
            position: absolute;
            bottom: 0;
            width: 15px;
            height: 5px;
            border-radius: 50%;
            background: rgba(56, 178, 172, 0.3);
            animation: splash 0.4s ease-out infinite;
        }
        
        @keyframes rain-fall {
            to { transform: translateY(calc(100vh + 20px)); }
        }
        
        @keyframes splash {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        /* 云朵装饰 */
        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            z-index: -2;
        }
        
        .cloud:before, .cloud:after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        
        /* 涟漪装饰 */
        .ripple {
            position: fixed;
            border: 2px solid rgba(56, 178, 172, 0.2);
            border-radius: 50%;
            animation: ripple-expand 3s infinite;
        }
        
        @keyframes ripple-expand {
            0% { transform: scale(0.1); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0; }
        }
        
        /* 修改原有颜色变量 */
        .background {
            background: var(--bg-gradient);
        }
        
        .music-control, .back-btn {
            background: rgba(44, 82, 130, 0.9);
        }
        
        .page-title {
            color: var(--primary-color);
        }
        
        .page-title:after {
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
        }
        
        .page-subtitle {
            color: var(--secondary-color);
        }
        
        .next-btn {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
        }
        
        .end-btn {
            background: linear-gradient(to right, var(--accent-color), var(--secondary-color));
        }
        
        /* 保持其他原有样式，仅修改颜色相关部分 */
        /* ... 其他CSS样式 ... */
    </style>
</head>
<body>
    <!-- 动态雨点背景 -->
    <div class="rain-background" id="rainBackground"></div>
    
    <!-- 原有背景和装饰 -->
    <div class="background"></div>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    
    <!-- 云朵装饰（CSS绘制） -->
    <div class="cloud cloud-1" style="top: 15%; left: 5%; width: 80px; height: 30px;"></div>
    <div class="cloud cloud-2" style="top: 10%; right: 8%; width: 60px; height: 25px;"></div>
    
    <!-- 涟漪装饰 -->
    <div class="ripple ripple-1" style="top: 70%; left: 20%; width: 100px; height: 100px;"></div>
    <div class="ripple ripple-2" style="top: 60%; right: 15%; width: 80px; height: 80px;"></div>
    
    <!-- 原有其他元素保持不变，仅修改内容 -->
    <!-- ... 页面结构和内容 ... -->
    
    <!-- 背景音乐 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="yushuibgm.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>
    
    <script>
        // 动态生成雨点
        function createRain() {
            const rainBg = document.getElementById('rainBackground');
            const rainCount = Math.floor(window.innerWidth / 10); // 根据屏幕宽度调整雨滴数量
            
            for (let i = 0; i < rainCount; i++) {
                // 雨滴
                const drop = document.createElement('div');
                drop.className = 'rain-drop';
                drop.style.left = `${Math.random() * 100}%`;
                drop.style.animationDuration = `${0.5 + Math.random() * 0.7}s`;
                drop.style.animationDelay = `${Math.random() * 2}s`;
                rainBg.appendChild(drop);
                
                // 涟漪
                if (i % 3 === 0) {
                    const splash = document.createElement('div');
                    splash.className = 'rain-splash';
                    splash.style.left = `${Math.random() * 100}%`;
                    splash.style.bottom = `${Math.random() * 20}%`;
                    splash.style.animationDelay = `${Math.random() * 5}s`;
                    rainBg.appendChild(splash);
                }
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            createRain();
            // ... 原有JavaScript代码 ...
        });
    </script>
</body>
</html>
