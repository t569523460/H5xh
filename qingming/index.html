<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清明节知识问答</title>

<style>
body,html{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:"微软雅黑";
}

.container{
    width:100vw;
    height:100vh;
    display:flex;
    transition:transform 0.5s ease;
}

/* 页面 */
.page{
    width:100vw;
    height:100vh;
    flex-shrink:0;
    background:url("bg.jpg") no-repeat center/cover;
    position:relative;
    color:#000;
    padding:30px 20px;
    box-sizing:border-box;
}

/* 雨丝动画 */
.rain{
    position:absolute;
    width:2px;
    height:80px;
    background:rgba(255,255,255,0.4);
    animation:rain 1s linear infinite;
}

@keyframes rain{
    from{transform:translateY(-100px);}
    to{transform:translateY(100vh);}
}

/* 内容左对齐 */
.question{
    font-size:20px;
    margin-bottom:20px;
    text-align:left;
}

.option{
    width:90%;
    padding:12px;
    margin:10px 0;
    background:rgba(255,255,255,0.85);
    border-radius:8px;
    text-align:left;
}

.option:active{
    background:#ddd;
}

.btn{
    position:absolute;
    bottom:30px;
    padding:8px 20px;
    background:#fff;
    border-radius:20px;
}

.prev{
    left:20px;
}

/* 成绩弹窗 */
.result{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.box{
    background:#fff;
    padding:30px;
    border-radius:10px;
    text-align:center;
}
</style>
</head>

<body>

<audio id="bgm" src="qingming.mp3" autoplay loop></audio>

<div class="container" id="container"></div>

<div class="result" id="resultBox">
    <div class="box">
        <h2>你的得分</h2>
        <p id="scoreText"></p>
        <button onclick="restart()">重新答题</button>
    </div>
</div>

<script>
const questions = [
{q:"清明节对应农历大约在什么时候？",
 o:["农历二月末至三月初","农历正月初一","农历五月初五","农历八月十五"],a:0},

{q:"清明节主要习俗是什么？",
 o:["扫墓祭祖","吃月饼","贴春联","赛龙舟"],a:0},

{q:"清明节又被称为？",
 o:["踏青节","中秋节","重阳节","元宵节"],a:0},

{q:"清明节在传统体系中属于？",
 o:["节气与节日结合","纯节气","纯节日","西方节日"],a:0},

{q:"以下哪项是清明传统食物？",
 o:["青团","粽子","汤圆","面条"],a:0},

{q:"清明踏青的意义是？",
 o:["亲近自然","避暑降温","庆祝丰收","祈求下雪"],a:0},

{q:"清明节起源与哪个传统有关？",
 o:["寒食节","元宵节","七夕节","春节"],a:0},

{q:"以下哪项不是清明活动？",
 o:["赛龙舟","扫墓","踏青","祭祖"],a:0},

{q:"“清明时节雨纷纷”出自谁？",
 o:["杜牧","李白","苏轼","王维"],a:0},

{q:"清明节主要表达什么情感？",
 o:["缅怀先人","欢庆丰收","迎接新年","表达爱情"],a:0}
];

// 打乱答案顺序函数
function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

// 初始化打乱
questions.forEach(q=>{
    let correct=q.o[q.a];
    shuffle(q.o);
    q.a=q.o.indexOf(correct);
});

let current=0;
let answers=new Array(questions.length).fill(null);

const container=document.getElementById("container");

//生成页面
questions.forEach((item,i)=>{
    const page=document.createElement("div");
    page.className="page";

    //生成雨丝
    for(let r=0;r<20;r++){
        let rain=document.createElement("div");
        rain.className="rain";
        rain.style.left=Math.random()*100+"%";
        rain.style.animationDuration=(0.5+Math.random())+"s";
        page.appendChild(rain);
    }

    const labels=["A.","B.","C.","D."];

    page.innerHTML += `
    <div class="question">${i+1}. ${item.q}</div>
    ${item.o.map((op,idx)=>`<div class="option" onclick="select(${i},${idx})">${labels[idx]} ${op}</div>`).join("")}
    ${i>0?'<div class="btn prev" onclick="prev()">上一题</div>':''}
    `;

    container.appendChild(page);
});

//选择答案
function select(qIndex,optionIndex){
    answers[qIndex]=optionIndex;

    if(qIndex<questions.length-1){
        next();
    }else{
        showResult();
    }
}

//下一题
function next(){
    current++;
    update();
}

//上一题
function prev(){
    current--;
    update();
}

//更新位置
function update(){
    container.style.transform=`translateX(-${current*100}vw)`;
}

//计算分数
function calcScore(){
    let score=0;
    questions.forEach((q,i)=>{
        if(answers[i]===q.a){
            score+=10;
        }
    });
    return score;
}

//显示结果
function showResult(){
    let score=calcScore();
    document.getElementById("scoreText").innerText=score+"分";
    document.getElementById("resultBox").style.display="flex";
}

//重新开始
function restart(){
    location.reload();
}

//解决自动播放
document.addEventListener("click",()=>{
    document.getElementById("bgm").play();
});
</script>

</body>
</html>
