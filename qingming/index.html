<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清明节知识问答</title>

<style>
body,html{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:"微软雅黑";
    color:#1f2f1f;
}

.container{
    width:100vw;
    height:100vh;
    display:flex;
    transition:transform 0.5s;
}

.page{
    width:100vw;
    height:100vh;
    flex-shrink:0;
    background:url("bg.jpg") no-repeat center/cover;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:40px 25px;
    box-sizing:border-box;
}

/* 题目 */
.question{
    font-size:26px;
    line-height:1.6;
}

/* 选项 */
.options{
    margin-top:20px;
}

.option{
    font-size:22px;
    margin:14px 0;
    padding:14px;
    background:rgba(200,230,200,0.6);
    border-radius:10px;
}

/* 按钮 */
.nextBtn{
    width:160px;
    margin:0 auto 30px;
    text-align:center;
    padding:12px;
    background:rgba(120,180,120,0.8);
    border-radius:25px;
    font-size:20px;
}

/* 提示弹窗 */
.tip{
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(180,220,180,0.9);
    padding:20px 30px;
    border-radius:12px;
    font-size:22px;
    display:none;
}

/* 结果弹窗 */
.result{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.box{
    background:rgba(200,240,200,0.95);
    padding:40px;
    border-radius:15px;
    text-align:center;
    width:70%;
}

.box h2{
    font-size:32px;
}

.box p{
    font-size:28px;
}

.box button{
    padding:12px 30px;
    font-size:20px;
    margin-top:20px;
}
</style>
</head>

<body>

<audio id="bgm" src="qingming.mp3" autoplay loop></audio>

<div class="container" id="container"></div>

<div class="tip" id="tip"></div>

<div class="result" id="resultBox">
  <div class="box">
    <h2>答题完成</h2>
    <p id="scoreText"></p>
    <button onclick="restart()">重新答题</button>
  </div>
</div>

<script>
const questions=[
{q:"清明节通常在什么时候？",
 o:["4月5日","5月1日","3月1日","6月1日"],a:0},

{q:"清明节主要习俗是什么？",
 o:["吃月饼","扫墓祭祖","贴春联","放鞭炮"],a:1},

{q:"清明节又称什么节？",
 o:["端午节","踏青节","重阳节","中秋节"],a:1},

{q:"以下哪项是清明传统食物？",
 o:["青团","饺子","汤圆","粽子"],a:0},

{q:"清明踏青的意义是？",
 o:["避暑","亲近自然","祈雨","庆丰收"],a:1},

{q:"清明节起源于哪个传统？",
 o:["春节","寒食节","七夕","元宵"],a:1},

{q:"清明节常见活动不包括？",
 o:["扫墓","踏青","祭祖","赛龙舟"],a:3},

{q:"“清明时节雨纷纷”出自谁？",
 o:["李白","杜牧","白居易","苏轼"],a:1},

{q:"清明节表达的情感是？",
 o:["爱情表达","迎接新年","缅怀先人","欢庆丰收"],a:2},

{q:"清明节属于哪一类节日？",
 o:["传统节日","西方节日","宗教节日","现代节日"],a:0}
];

let current=0;
let score=0;

const letters=["A","B","C","D"];
const container=document.getElementById("container");

//生成页面
questions.forEach((item,i)=>{
    const page=document.createElement("div");
    page.className="page";

    page.innerHTML=`
    <div>
        <div class="question">${i+1}. ${item.q}</div>
        <div class="options">
        ${item.o.map((op,idx)=>`
            <div class="option" onclick="select(${i},${idx})">
            ${letters[idx]}. ${op}
            </div>`).join("")}
        </div>
    </div>
    <div class="nextBtn" onclick="next()">下一题</div>
    `;

    container.appendChild(page);
});

function select(qIndex,optionIndex){
    const tip=document.getElementById("tip");

    if(optionIndex===questions[qIndex].a){
        score+=10;
        tip.innerText="回答正确";
    }else{
        const correct=questions[qIndex].a;
        tip.innerText=`正确答案：${letters[correct]}.${questions[qIndex].o[correct]}`;
    }

    tip.style.display="block";

    setTimeout(()=>{
        tip.style.display="none";
    },1500);
}

function next(){
    if(current<questions.length-1){
        current++;
        container.style.transform=`translateX(-${current*100}vw)`;
    }else{
        showResult();
    }
}

function showResult(){
    document.getElementById("scoreText").innerText=score+"分 / 100分";
    document.getElementById("resultBox").style.display="flex";
}

function restart(){
    location.reload();
}

//解决自动播放限制
document.addEventListener("click",()=>{
    document.getElementById("bgm").play();
});
</script>

</body>
</html>
