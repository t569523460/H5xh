<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清明节知识问答</title>
<style>
body,html{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:"微软雅黑";
}

.container{
    width:100vw;
    height:100vh;
    display:flex;
    transition:transform 0.5s;
}

.page{
    width:100vw;
    height:100vh;
    flex-shrink:0;
    background:url("bg.jpg") no-repeat center/cover;
    background-size:cover;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:40px 25px;
    box-sizing:border-box;
    color:#1f2f1f;
}

#rainCanvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.question{
    font-size:26px;
    line-height:1.6;
    text-align:left;
}

.options{
    margin-top:20px;
}

.option{
    font-size:22px;
    margin:14px 0;
    padding:14px;
    background:rgba(200,230,200,0.6);
    border-radius:10px;
}

.bottomBtn{
    width:160px;
    margin:0 auto 30px;
    text-align:center;
    padding:12px;
    background:rgba(120,180,120,0.8);
    border-radius:25px;
    font-size:20px;
}

.tipOverlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

.tip{
    background:#fff;
    padding:20px 30px;
    border-radius:12px;
    font-size:22px;
    text-align:center;
    max-width:80%;
    word-break:keep-all;
}

.resultOverlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

.resultBox{
    background:#fff;
    padding:40px;
    border-radius:15px;
    text-align:center;
    width:70%;
}

.resultBox h2{
    font-size:32px;
}

.resultBox p{
    font-size:28px;
}

.resultBox button{
    padding:12px 30px;
    font-size:20px;
    margin-top:20px;
}
</style>
</head>
<body>

<audio id="bgm" src="qingming.mp3" autoplay loop></audio>
<canvas id="rainCanvas"></canvas>

<div class="container" id="container"></div>

<div class="tipOverlay" id="tipOverlay">
    <div class="tip" id="tip"></div>
</div>

<div class="resultOverlay" id="resultOverlay">
    <div class="resultBox">
        <h2>答题完成</h2>
        <p id="scoreText"></p>
        <button onclick="restart()">重新答题</button>
    </div>
</div>

<script>
const questions=[
{q:"清明节通常在什么时候？",o:["4月5日","5月1日","3月1日","6月1日"],a:0},
{q:"清明节主要习俗是什么？",o:["吃月饼","扫墓祭祖","贴春联","放鞭炮"],a:1},
{q:"清明节又称什么节？",o:["端午节","踏青节","重阳节","中秋节"],a:1},
{q:"以下哪项是清明传统食物？",o:["青团","饺子","汤圆","粽子"],a:0},
{q:"清明踏青的意义是？",o:["避暑","亲近自然","祈雨","庆丰收"],a:1},
{q:"清明节起源于哪个传统？",o:["春节","寒食节","七夕","元宵"],a:1},
{q:"清明节常见活动不包括？",o:["扫墓","踏青","祭祖","赛龙舟"],a:3},
{q:"“清明时节雨纷纷”出自谁？",o:["李白","杜牧","白居易","苏轼"],a:1},
{q:"清明节表达的情感是？",o:["爱情表达","迎接新年","缅怀先人","欢庆丰收"],a:2},
{q:"清明节属于哪一类节日？",o:["传统节日","西方节日","宗教节日","现代节日"],a:0}
];

const letters=["A","B","C","D"];
let current=0;
let answers=new Array(questions.length).fill(null);
const container=document.getElementById("container");

//生成页面
questions.forEach((item,i)=>{
    const page=document.createElement("div");
    page.className="page";
    page.innerHTML=`
    <div>
        <div class="question">${i+1}. ${item.q}</div>
        <div class="options">
        ${item.o.map((op,idx)=>`<div class="option" onclick="select(${i},${idx})">${letters[idx]}. ${op}</div>`).join("")}
        </div>
    </div>
    <div class="bottomBtn" id="btn${i}">${i===9?'重新开始':'上一题'}</div>
    `;
    container.appendChild(page);
});

//选择答案
function select(qIndex,optIndex){
    const tipOverlay=document.getElementById("tipOverlay");
    const tip=document.getElementById("tip");
    answers[qIndex]=optIndex; //更新答案
    if(optIndex===questions[qIndex].a){
        tip.innerText="回答正确";
    }else{
        const correct=questions[qIndex].a;
        tip.innerText=`正确答案：${letters[correct]}. ${questions[qIndex].o[correct]}`;
    }
    tipOverlay.style.display="flex";
    setTimeout(()=>{
        tipOverlay.style.display="none";
        if(qIndex<questions.length-1){
            current++;
            container.style.transform=`translateX(-${current*100}vw)`;
        }else{
            showResult();
        }
    },1500);
}

//底部按钮
for(let i=0;i<questions.length;i++){
    const btn=document.getElementById(`btn${i}`);
    if(i===0){btn.style.display="none";}
    btn.addEventListener("click",()=>{
        if(i<9){
            current--;
            container.style.transform=`translateX(-${current*100}vw)`;
        }else{
            restart();
        }
    });
}

function showResult(){
    let score=0;
    for(let i=0;i<questions.length;i++){
        if(answers[i]===questions[i].a) score+=10;
    }
    document.getElementById("scoreText").innerText=`得分：${score} / 100`;
    document.getElementById("resultOverlay").style.display="flex";
    document.getElementById("resultOverlay").addEventListener("click",()=>{
        document.getElementById("resultOverlay").style.display="none";
    });
}

function restart(){
    location.reload();
}

//雨丝动画（同一方向）
const canvas=document.getElementById("rainCanvas");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let rain=[];
const rainCount=150;
for(let i=0;i<rainCount;i++){
    rain.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        l:Math.random()*15+10,
        xs:2,   //倾斜速度X
        ys:6    //下降速度Y
    });
}

function drawRain(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(200,255,255,0.5)';
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<rainCount;i++){
        let r=rain[i];
        ctx.moveTo(r.x,r.y);
        ctx.lineTo(r.x + r.xs*2, r.y + r.ys);
    }
    ctx.stroke();
    moveRain();
}

function moveRain(){
    for(let i=0;i<rainCount;i++){
        let r=rain[i];
        r.x += r.xs;
        r.y += r.ys;
        if(r.y>canvas.height || r.x>canvas.width){
            r.x=Math.random()*canvas.width;
            r.y=-20;
        }
    }
    requestAnimationFrame(drawRain);
}
drawRain();

//自动播放音乐
document.addEventListener("click",()=>{
    document.getElementById("bgm").play();
});
</script>
</body>
</html>
