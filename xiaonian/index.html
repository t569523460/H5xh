<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南北小年文化展</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f1e6;
            color: #5c3d2e;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* 页面容器 */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }

        .active {
            display: flex;
            opacity: 1;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, rgba(255,245,230,0.8) 0%, rgba(248,241,230,1) 100%);
            overflow: hidden;
        }

        .bg-decoration::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(232, 177, 136, 0.1);
            border-radius: 50%;
            top: -150px;
            right: -100px;
        }

        .bg-decoration::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(188, 108, 37, 0.08);
            border-radius: 50%;
            bottom: -100px;
            left: -50px;
        }

        /* 开始页面 */
        #start-page {
            background: linear-gradient(rgba(248, 241, 230, 0.9), rgba(248, 241, 230, 0.95)), url('') center/cover no-repeat;
        }

        .title {
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 1rem;
            color: #d2691e;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 3rem;
            color: #8b4513;
            font-weight: 300;
        }

        .selection-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 80%;
            max-width: 300px;
        }

        .selection-btn {
            padding: 1.2rem 2rem;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .selection-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            z-index: -1;
            transition: transform 0.5s ease;
            transform: scaleX(0);
            transform-origin: right;
        }

        .selection-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .north-btn {
            background: linear-gradient(to right, #8b4513, #d2691e);
            color: white;
            box-shadow: 0 5px 15px rgba(139, 69, 19, 0.3);
        }

        .south-btn {
            background: linear-gradient(to right, #2e8b57, #3cb371);
            color: white;
            box-shadow: 0 5px 15px rgba(46, 139, 87, 0.3);
        }

        /* 物品展示页面 */
        .page-header {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            align-items: center;
            width: calc(100% - 2rem);
            z-index: 10;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #5c3d2e;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: white;
            transform: scale(1.05);
        }

        .region-title {
            margin-left: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #5c3d2e;
        }

        .items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            width: 100%;
            padding: 2rem;
            max-width: 900px;
            margin-top: 3rem;
        }

        .item-card {
            width: 150px;
            height: 150px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-10px);
        }

        .item-img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 2;
        }

        /* 呼吸边缘光效果 */
        @keyframes breath-glow {
            0%, 100% {
                box-shadow: 0 0 10px 5px rgba(210, 105, 30, 0.5);
            }
            50% {
                box-shadow: 0 0 20px 10px rgba(210, 105, 30, 0.8);
            }
        }

        .breath-glow {
            animation: breath-glow 2.5s infinite ease-in-out;
        }

        .item-name {
            position: absolute;
            bottom: -25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #5c3d2e;
            z-index: 1;
        }

        /* 物品详情弹窗 */
        .item-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: white;
            width: 85%;
            max-width: 400px;
            border-radius: 20px;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-active .modal-content {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            color: #5c3d2e;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .close-modal:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .modal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #8b4513;
        }

        .modal-desc {
            font-size: 1rem;
            line-height: 1.5;
            color: #5c3d2e;
        }

        /* 完成页面 */
        .completion-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .completion-active {
            display: flex;
            opacity: 1;
        }

        .completion-content {
            background-color: white;
            width: 85%;
            max-width: 400px;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(20px);
            transition: transform 0.5s ease;
        }

        .completion-active .completion-content {
            transform: translateY(0);
        }

        .completion-title {
            font-size: 1.8rem;
            color: #d2691e;
            margin-bottom: 1rem;
        }

        .completion-text {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            color: #5c3d2e;
        }

        .completion-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .completion-btn {
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .other-region {
            background: linear-gradient(to right, #2e8b57, #3cb371);
            color: white;
        }

        .back-start {
            background: linear-gradient(to right, #8b4513, #d2691e);
            color: white;
        }

        /* 音乐播放器 */
        .music-player {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 50;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-player:hover {
            transform: scale(1.05);
            background-color: white;
        }

        .music-icon {
            font-size: 1.5rem;
            color: #d2691e;
        }

        .music-playing .music-icon::before {
            content: "\f028";
        }

        .music-paused .music-icon::before {
            content: "\f026";
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .item-card {
                width: 130px;
                height: 130px;
            }
            
            .modal-content {
                width: 90%;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .items-container {
                gap: 1.5rem;
            }
            
            .item-card {
                width: 110px;
                height: 110px;
            }
            
            .item-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 开始页面 -->
    <div id="start-page" class="page active">
        <div class="bg-decoration"></div>
        <h1 class="title">南北小年文化</h1>
        <p class="subtitle">选择地区，探索不同的小年习俗</p>
        <div class="selection-buttons">
            <button class="selection-btn north-btn" id="north-btn">北方小年</button>
            <button class="selection-btn south-btn" id="south-btn">南方小年</button>
        </div>
    </div>

    <!-- 北方小年页面 -->
    <div id="north-page" class="page">
        <div class="bg-decoration"></div>
        <div class="page-header">
            <div class="back-btn" id="back-from-north">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="region-title">北方小年 · 腊月廿三</div>
        </div>
        
        <div class="items-container">
            <!-- 北方小年物品1 -->
            <div class="item-card" id="north-item1">
                <img src="" alt="饺子" class="item-img breath-glow" id="north-img1">
                <div class="item-name">饺子</div>
            </div>
            
            <!-- 北方小年物品2 -->
            <div class="item-card" id="north-item2">
                <img src="" alt="灶糖" class="item-img breath-glow" id="north-img2">
                <div class="item-name">灶糖</div>
            </div>
            
            <!-- 北方小年物品3 -->
            <div class="item-card" id="north-item3">
                <img src="" alt="花馍" class="item-img breath-glow" id="north-img3">
                <div class="item-name">花馍</div>
            </div>
        </div>
    </div>

    <!-- 南方小年页面 -->
    <div id="south-page" class="page">
        <div class="bg-decoration"></div>
        <div class="page-header">
            <div class="back-btn" id="back-from-south">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="region-title">南方小年 · 腊月廿四</div>
        </div>
        
        <div class="items-container">
            <!-- 南方小年物品1 -->
            <div class="item-card" id="south-item1">
                <img src="" alt="甘蔗" class="item-img breath-glow" id="south-img1">
                <div class="item-name">甘蔗</div>
            </div>
            
            <!-- 南方小年物品2 -->
            <div class="item-card" id="south-item2">
                <img src="" alt="年糕" class="item-img breath-glow" id="south-img2">
                <div class="item-name">年糕</div>
            </div>
            
            <!-- 南方小年物品3 -->
            <div class="item-card" id="south-item3">
                <img src="" alt="汤圆" class="item-img breath-glow" id="south-img3">
                <div class="item-name">汤圆</div>
            </div>
        </div>
    </div>

    <!-- 物品详情弹窗 -->
    <div id="item-modal" class="item-modal">
        <div class="modal-content">
            <div class="close-modal" id="close-modal">&times;</div>
            <img src="" alt="" class="modal-img" id="modal-img">
            <h3 class="modal-title" id="modal-title">物品名称</h3>
            <p class="modal-desc" id="modal-desc">物品介绍内容...</p>
        </div>
    </div>

    <!-- 完成页面弹窗 -->
    <div id="completion-modal" class="completion-modal">
        <div class="completion-content">
            <h3 class="completion-title">探索完成！</h3>
            <p class="completion-text" id="completion-text">您已完成北方小年的探索，想要继续了解另一边的小年习俗吗？</p>
            <div class="completion-buttons">
                <button class="completion-btn other-region" id="other-region-btn">查看另一边小年</button>
                <button class="completion-btn back-start" id="back-to-start-btn">返回首页</button>
            </div>
        </div>
    </div>

    <!-- 音乐播放器 -->
    <div id="music-player" class="music-player music-playing">
        <i class="fas fa-volume-up music-icon"></i>
    </div>

    <!-- 背景音乐 -->
    <audio id="bg-music" loop>
        <source src="xiaonianbgm.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

    <script>
        // 页面切换逻辑
        document.addEventListener('DOMContentLoaded', function() {
            // 获取所有页面元素
            const startPage = document.getElementById('start-page');
            const northPage = document.getElementById('north-page');
            const southPage = document.getElementById('south-page');
            
            // 获取按钮元素
            const northBtn = document.getElementById('north-btn');
            const southBtn = document.getElementById('south-btn');
            const backFromNorth = document.getElementById('back-from-north');
            const backFromSouth = document.getElementById('back-from-south');
            
            // 获取弹窗元素
            const itemModal = document.getElementById('item-modal');
            const completionModal = document.getElementById('completion-modal');
            const closeModal = document.getElementById('close-modal');
            const otherRegionBtn = document.getElementById('other-region-btn');
            const backToStartBtn = document.getElementById('back-to-start-btn');
            
            // 获取音乐元素
            const bgMusic = document.getElementById('bg-music');
            const musicPlayer = document.getElementById('music-player');
            
            // 当前查看的地区
            let currentRegion = null;
            // 已查看的物品计数
            let viewedItems = {
                north: 0,
                south: 0
            };
            
            // 物品数据
            const itemsData = {
                north: [
                    {
                        id: 'north-item1',
                        name: '饺子',
                        desc: '北方小年有吃饺子的习俗，取意"送行饺子迎风面"。饺子形似元宝，寓意招财进宝，也有团圆美满之意。',
                        imgId: 'north-img1'
                    },
                    {
                        id: 'north-item2',
                        name: '灶糖',
                        desc: '灶糖是一种麦芽糖，粘性很大。北方小年祭灶时会供上灶糖，寓意粘住灶王爷的嘴，让他"上天言好事，回宫降吉祥"。',
                        imgId: 'north-img2'
                    },
                    {
                        id: 'north-item3',
                        name: '花馍',
                        desc: '花馍又称面花，是北方民间面塑品。小年蒸花馍寓意来年日子"蒸蒸日上"，不同造型的花馍有不同的吉祥寓意。',
                        imgId: 'north-img3'
                    }
                ],
                south: [
                    {
                        id: 'south-item1',
                        name: '甘蔗',
                        desc: '南方小年有吃甘蔗的习俗，甘蔗寓意"节节高"和"甜甜蜜蜜"。甘蔗带有尾巴，象征着做事善始善终。',
                        imgId: 'south-img1'
                    },
                    {
                        id: 'south-item2',
                        name: '年糕',
                        desc: '南方小年吃年糕，寓意"年年高"。年糕由糯米制成，软糯香甜，是南方许多地区过小年必备的传统食品。',
                        imgId: 'south-img2'
                    },
                    {
                        id: 'south-item3',
                        name: '汤圆',
                        desc: '南方部分地区小年有吃汤圆的习俗，取意"团团圆圆"。汤圆馅料多样，香甜软糯，象征家庭和睦、生活甜蜜。',
                        imgId: 'south-img3'
                    }
                ]
            };
            
            // 切换到北方页面
            northBtn.addEventListener('click', function() {
                startPage.classList.remove('active');
                northPage.classList.add('active');
                currentRegion = 'north';
                // 重置已查看物品计数
                viewedItems[currentRegion] = 0;
            });
            
            // 切换到南方页面
            southBtn.addEventListener('click', function() {
                startPage.classList.remove('active');
                southPage.classList.add('active');
                currentRegion = 'south';
                // 重置已查看物品计数
                viewedItems[currentRegion] = 0;
            });
            
            // 从北方页面返回
            backFromNorth.addEventListener('click', function() {
                northPage.classList.remove('active');
                startPage.classList.add('active');
                currentRegion = null;
            });
            
            // 从南方页面返回
            backFromSouth.addEventListener('click', function() {
                southPage.classList.remove('active');
                startPage.classList.add('active');
                currentRegion = null;
            });
            
            // 为所有物品添加点击事件
            function setupItemClickEvents() {
                // 北方物品
                itemsData.north.forEach(item => {
                    const itemElement = document.getElementById(item.id);
                    itemElement.addEventListener('click', function() {
                        showItemModal(item);
                        // 增加已查看物品计数
                        viewedItems.north++;
                        // 检查是否全部查看完毕
                        if (viewedItems.north === itemsData.north.length) {
                            setTimeout(() => {
                                showCompletionModal('north');
                            }, 500);
                        }
                    });
                });
                
                // 南方物品
                itemsData.south.forEach(item => {
                    const itemElement = document.getElementById(item.id);
                    itemElement.addEventListener('click', function() {
                        showItemModal(item);
                        // 增加已查看物品计数
                        viewedItems.south++;
                        // 检查是否全部查看完毕
                        if (viewedItems.south === itemsData.south.length) {
                            setTimeout(() => {
                                showCompletionModal('south');
                            }, 500);
                        }
                    });
                });
            }
            
            // 显示物品详情弹窗
            function showItemModal(item) {
                document.getElementById('modal-title').textContent = item.name;
                document.getElementById('modal-desc').textContent = item.desc;
                document.getElementById('modal-img').src = document.getElementById(item.imgId).src;
                
                itemModal.classList.add('modal-active');
            }
            
            // 关闭物品详情弹窗
            closeModal.addEventListener('click', function() {
                itemModal.classList.remove('modal-active');
            });
            
            // 点击弹窗外区域关闭弹窗
            itemModal.addEventListener('click', function(e) {
                if (e.target === itemModal) {
                    itemModal.classList.remove('modal-active');
                }
            });
            
            // 显示完成弹窗
            function showCompletionModal(region) {
                const completionText = document.getElementById('completion-text');
                const otherRegionText = region === 'north' ? '南方小年' : '北方小年';
                const currentRegionText = region === 'north' ? '北方' : '南方';
                
                completionText.textContent = `您已完成${currentRegionText}小年的探索，想要继续了解另一边的小年习俗吗？`;
                document.getElementById('other-region-btn').textContent = `查看${otherRegionText}`;
                
                completionModal.classList.add('completion-active');
            }
            
            // 完成弹窗按钮事件
            otherRegionBtn.addEventListener('click', function() {
                completionModal.classList.remove('completion-active');
                itemModal.classList.remove('modal-active');
                
                // 切换到另一个地区
                if (currentRegion === 'north') {
                    northPage.classList.remove('active');
                    southPage.classList.add('active');
                    currentRegion = 'south';
                } else {
                    southPage.classList.remove('active');
                    northPage.classList.add('active');
                    currentRegion = 'north';
                }
                
                // 重置已查看物品计数
                viewedItems[currentRegion] = 0;
            });
            
            backToStartBtn.addEventListener('click', function() {
                completionModal.classList.remove('completion-active');
                itemModal.classList.remove('modal-active');
                
                // 返回开始页面
                northPage.classList.remove('active');
                southPage.classList.remove('active');
                startPage.classList.add('active');
                currentRegion = null;
            });
            
            // 音乐控制
            // 自动播放音乐
            function playBackgroundMusic() {
                bgMusic.volume = 0.5;
                bgMusic.play().catch(error => {
                    console.log("自动播放被阻止，需要用户交互");
                });
            }
            
            // 音乐播放器点击事件
            musicPlayer.addEventListener('click', function() {
                if (bgMusic.paused) {
                    bgMusic.play();
                    musicPlayer.classList.remove('music-paused');
                    musicPlayer.classList.add('music-playing');
                } else {
                    bgMusic.pause();
                    musicPlayer.classList.remove('music-playing');
                    musicPlayer.classList.add('music-paused');
                }
            });
            
            // 页面加载后尝试播放音乐
            setTimeout(playBackgroundMusic, 1000);
            
            // 用户与页面交互时播放音乐
            document.body.addEventListener('click', function() {
                if (bgMusic.paused) {
                    bgMusic.play();
                    musicPlayer.classList.remove('music-paused');
                    musicPlayer.classList.add('music-playing');
                }
            }, { once: true });
            
            // 初始化物品点击事件
            setupItemClickEvents();
            
            // 为页面添加加载动画
            const items = document.querySelectorAll('.item-card');
            items.forEach((item, index) => {
                item.style.opacity = '0';
                item.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    item.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, 300 + index * 200);
            });
        });
    </script>
</body>
</html>
