<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元宵节猜灯谜</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:"微软雅黑";
    background:#8b0000;
    display:flex;
    justify-content:center;
}

/* 整体容器（手机比例） */
.container{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:url("yuanxiao.jpg") no-repeat center;
    background-size:cover;
    padding:40px 20px;
    box-sizing:border-box;
}

/* 标题 */
.title{
    text-align:center;
    font-size:28px;
    color:#fff;
    font-weight:bold;
    margin-bottom:40px;
    letter-spacing:3px;
}

/* 灯谜按钮 */
.riddle-btn{
    display:block;
    width:100%;
    padding:18px;
    margin-bottom:25px;
    background:linear-gradient(45deg,#ffae00,#ff3c00);
    color:#fff;
    font-size:18px;
    border:none;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.riddle-btn:active{
    transform:scale(0.97);
}

/* 弹出层背景 */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

/* 弹出内容框 */
.popup{
    width:85%;
    max-width:400px;
    background:#fff3e0;
    border-radius:15px;
    padding:30px 20px 40px 20px;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* 关闭按钮 */
.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:22px;
    color:#ff3c00;
    cursor:pointer;
}

/* 灯谜文字 */
.riddle-text{
    font-size:18px;
    line-height:30px;
    color:#b22222;
    margin-top:20px;
    margin-bottom:30px;
}

/* 返回按钮 */
.back-btn{
    display:block;
    width:100%;
    padding:12px;
    background:linear-gradient(45deg,#ff6f00,#ff0000);
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">元宵佳节 · 猜灯谜</div>

    <button class="riddle-btn" onclick="openRiddle(1)">点击查看灯谜一</button>
    <button class="riddle-btn" onclick="openRiddle(2)">点击查看灯谜二</button>
    <button class="riddle-btn" onclick="openRiddle(3)">点击查看灯谜三</button>
    <button class="riddle-btn" onclick="openRiddle(4)">点击查看灯谜四</button>
</div>

<!-- 弹出层 -->
<div class="overlay" id="overlay">
    <div class="popup">
        <div class="close" onclick="closeRiddle()">×</div>
        <div class="riddle-text" id="riddleContent"></div>
        <button class="back-btn" onclick="closeRiddle()">返回</button>
    </div>
</div>

<script>

const riddles = {
1:"身穿绿衣裳，肚里水汪汪。\n生的子儿多，个个黑脸膛。（打一水果）",
2:"有面没有口，有脚没有手。\n虽有四只脚，自己不会走。（打一物）",
3:"弯弯一座桥，架在半天腰。\n七色排得好，雨后天上飘。（打一自然现象）",
4:"小时青青腹中空，长大变成白头翁。\n飞到天边去，飘落无影踪。（打一植物）"
};

function openRiddle(num){
    document.getElementById("riddleContent").innerText = riddles[num];
    document.getElementById("overlay").style.display = "flex";
}

function closeRiddle(){
    document.getElementById("overlay").style.display = "none";
}

</script>

</body>
</html>
