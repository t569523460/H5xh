<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>元宵灯谜 · 暖橙米白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", "苹方", "PingFang SC", sans-serif;
        }

        /* 背景：使用 yuanxiao.jpg，并加一层半透明柔光 */
        body {
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url('yuanxiao.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* 书签通用样式 */
        .clue {
            position: absolute;
            width: 90px;
            height: 180px;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1), filter 0.3s;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.3));
            will-change: transform;
            object-fit: contain;
        }

        .clue:hover {
            transform: scale(1.08) translateY(-4px);
            filter: drop-shadow(0 15px 20px rgba(255, 180, 60, 0.8));
        }

        /* 书签向中心进一步靠拢 (比之前更集中) */
        .clue1 {
            top: 12%;
            left: 8%;
        }
        .clue2 {
            top: 12%;
            right: 8%;
            left: auto;
        }
        .clue3 {
            bottom: 12%;
            left: 8%;
            top: auto;
        }
        .clue4 {
            bottom: 12%;
            right: 8%;
            top: auto;
            left: auto;
        }

        /* 超小屏 (<=480px) 继续内收，保证不贴边 */
        @media (max-width: 480px) {
            .clue {
                width: 70px;
                height: 140px;
            }
            .clue1 { left: 5%; top: 10%; }
            .clue2 { right: 5%; top: 10%; }
            .clue3 { left: 5%; bottom: 10%; }
            .clue4 { right: 5%; bottom: 10%; }
        }

        /* 平板适中 */
        @media (min-width: 768px) and (max-width: 1024px) {
            .clue {
                width: 100px;
                height: 200px;
            }
            .clue1 { left: 10%; top: 15%; }
            .clue2 { right: 10%; top: 15%; }
            .clue3 { left: 10%; bottom: 15%; }
            .clue4 { right: 10%; bottom: 15%; }
        }

        /* ---------- 弹窗 (亮橙色背景，米白按钮) ---------- */
        .clue-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(620px, 88vw);
            min-width: 300px;
            background: #FF8C42;        /* 亮橙色主调 */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 2.4rem 1.8rem 2.4rem;
            box-shadow: 0 30px 40px -15px rgba(200, 80, 0, 0.6),
                        0 0 0 2px #FFB57C inset;
            text-align: center;
            z-index: 100;
            display: none;
            border: 2px solid #FFD5AA;
        }

        /* 谜面文字区域 */
        #clue-text {
            font-size: 2.0rem;
            font-weight: 600;
            line-height: 1.5;
            color: #3D1F00;
            text-shadow: 0 2px 5px #FFDDBB;
            margin: 1rem 0.2rem 1.2rem;
            padding: 0.8rem 1rem;
            background: rgba(255, 225, 190, 0.5);
            border-radius: 40px;
            word-break: break-word;
            letter-spacing: 0.02em;
        }

        /* 米白色按钮 */
        .show-answer-btn {
            margin: 2rem 0 1.2rem;
            padding: 1.2rem 3rem;
            background: #FFF8E7;        /* 米白 */
            border: none;
            color: #B14500;
            font-size: 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 16px -6px #914B1A, 0 0 0 2px #FFB069 inset;
            transition: all 0.25s ease;
            letter-spacing: 3px;
            border: 1px solid #FFAA66;
        }

        .show-answer-btn:hover {
            background: #FFF2D0;
            transform: scale(1.02) translateY(-4px);
            box-shadow: 0 16px 24px -8px #B35600, 0 0 0 3px #FFBD7F inset;
        }

        .show-answer-btn:active {
            transform: scale(0.97) translateY(1px);
            box-shadow: 0 6px 12px -3px #7F3B00;
        }

        /* 答案区域 —— 纯谜底，无灯笼符号 */
        .answer {
            margin: 1.8rem 0.5rem 0.8rem;
            font-size: 2.6rem;
            font-weight: 800;
            color: #5D2E00;
            background: rgba(255, 235, 200, 0.9);
            padding: 1rem 1.5rem;
            border-radius: 50px;
            display: none;
            border: 3px solid #FF9933;
            text-shadow: 1px 1px 0 #FFEEDD;
            word-break: break-word;
            line-height: 1.3;
            letter-spacing: 2px;
        }

        /* 关闭按钮 (自然圆形) */
        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            width: 44px;
            height: 44px;
            background-color: rgba(230, 140, 70, 0.4);
            border-radius: 50%;
            font-size: 38px;
            font-weight: 300;
            line-height: 42px;
            text-align: center;
            color: #4F2C0C;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            backdrop-filter: blur(6px);
            border: 1px solid #FFB681;
            box-shadow: 0 4px 10px rgba(150, 60, 0, 0.3);
            user-select: none;
        }

        .close-btn:hover {
            background-color: rgba(240, 150, 80, 0.7);
            color: #2C1705;
            transform: rotate(90deg) scale(1.1);
        }
        .close-btn:active {
            transform: rotate(90deg) scale(0.9);
            background-color: #C96A2E;
            color: white;
        }

        /* 弹窗出现动画 */
        .clue-content[style*="display: block"] {
            animation: popFade 0.3s ease-out;
        }
        @keyframes popFade {
            0% { opacity: 0; transform: translate(-50%, -35%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* 手机小屏文字适配 */
        @media (max-width: 480px) {
            #clue-text { font-size: 1.8rem; }
            .show-answer-btn { font-size: 1.6rem; padding: 1rem 2rem; }
            .answer { font-size: 2.2rem; }
            .close-btn { width: 38px; height: 38px; font-size: 32px; line-height: 36px; top: 12px; right: 16px; }
        }
    </style>
</head>
<body>

    <!-- 背景音乐：打开自动播放 (浏览器可能限制，通过JS辅助) -->
    <audio id="bgm" loop src="bgm.mp3" preload="auto"></audio>

    <!-- 四枚书签，命名 shuqian1.png ~ shuqian4.png -->
    <img src="shuqian1.png" class="clue clue1" data-clue="白日藏山后，星子落满头，伸手摸不着，眨眼亮如昼。" alt="灯谜书签">
    <img src="shuqian2.png" class="clue clue2" data-clue="一横一竖框天地，中间藏着日和月，春夏秋冬轮流转，四季风光它都见。" alt="灯谜书签">
    <img src="shuqian3.png" class="clue clue3" data-clue="千根线来万根线，落到水里看不见，风儿吹来它起舞，雨过天晴彩虹现。" alt="灯谜书签">
    <img src="shuqian4.png" class="clue clue4" data-clue="日落西山并列明，二人肩并肩。" alt="灯谜书签">

    <!-- 灯谜展示卡 (无顶部装饰) -->
    <div class="clue-content" id="clue-content">
        <div id="clue-text"></div>
        <button class="show-answer-btn" id="show-answer-btn">谜底</button>
        <div id="answer" class="answer"></div>
        <span class="close-btn" id="close-btn">×</span>
    </div>

    <script>
        (function() {
            // 获取元素
            const clues = document.querySelectorAll('.clue');
            const clueContent = document.getElementById('clue-content');
            const clueText = document.getElementById('clue-text');
            const showAnswerBtn = document.getElementById('show-answer-btn');
            const answerDiv = document.getElementById('answer');
            const closeBtn = document.getElementById('close-btn');
            const bgm = document.getElementById('bgm');

            // 谜底数据（只有纯谜底，无解析）
            const cluesData = {
                "白日藏山后，星子落满头，伸手摸不着，眨眼亮如昼。": "闪电",
                "一横一竖框天地，中间藏着日和月，春夏秋冬轮流转，四季风光它都见。": "田",
                "千根线来万根线，落到水里看不见，风儿吹来它起舞，雨过天晴彩虹现。": "雨",
                "日落西山并列明，二人肩并肩。": "明"
            };

            let currentClueText = '';
            let bgmStarted = false;   // 标记音乐是否已开始播放

            // ---------- 背景音乐自动播放 ----------
            function attemptAutoPlay() {
                bgm.play()
                    .then(() => {
                        bgmStarted = true;
                        console.log('BGM 自动播放成功');
                    })
                    .catch(error => {
                        console.log('自动播放被浏览器阻止，等待用户首次点击书签时播放', error);
                        // 不设置标志，等待用户交互
                    });
            }

            // 页面加载后立即尝试播放
            window.addEventListener('load', attemptAutoPlay);

            // 如果自动播放失败，则在第一次点击书签时播放音乐（无额外开关）
            function tryStartBGM() {
                if (!bgmStarted) {
                    bgm.play()
                        .then(() => {
                            bgmStarted = true;
                            console.log('BGM 通过点击书签播放成功');
                        })
                        .catch(e => console.warn('BGM 播放失败', e));
                }
            }

            // ---------- 书签点击事件 ----------
            clues.forEach(clue => {
                clue.addEventListener('click', (e) => {
                    // 先尝试启动音乐（如果尚未启动）
                    tryStartBGM();

                    // 显示对应的灯谜
                    const clueTextContent = e.target.getAttribute('data-clue');
                    clueText.innerText = clueTextContent;
                    answerDiv.style.display = 'none';
                    answerDiv.innerText = '';          // 清空旧答案
                    clueContent.style.display = 'block';
                    currentClueText = clueTextContent;
                });
            });

            // 显示答案：只显示纯谜底，无灯笼符号
            showAnswerBtn.addEventListener('click', () => {
                const answerText = cluesData[currentClueText];
                if (answerText) {
                    answerDiv.innerText = answerText;   // 纯文本，无装饰
                } else {
                    answerDiv.innerText = '喜乐元宵';
                }
                answerDiv.style.display = 'block';
            });

            // 关闭弹窗
            closeBtn.addEventListener('click', () => {
                clueContent.style.display = 'none';
            });

            // 可选：点击弹窗外区域不关闭，仅X关闭
        })();
    </script>

    <!-- 提醒用户放置正确的资源文件（不影响运行） -->
    <!-- 
        请将背景图片命名为 yuanxiao.jpg 并放在与本HTML相同的文件夹内。
        将四个书签图片分别命名为 shuqian1.png, shuqian2.png, shuqian3.png, shuqian4.png。
        将背景音乐命名为 bgm.mp3 并放在同一文件夹（浏览器可能限制自动播放，但代码已做兼容处理）。
    -->
</body>
</html>
