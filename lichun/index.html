<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>立春 - 春暖花开</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #e6f7ff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            color: #2d5016;
        }
        
        /* 背景容器 */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        /* 背景图片 */
        #background {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        /* 游戏标题 */
        #game-title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
        }
        
        #game-title h1 {
            font-size: 2.8rem;
            color: #ff6b6b;
            text-shadow: 3px 3px 0 #ffd166, 5px 5px 5px rgba(0, 0, 0, 0.2);
            margin-bottom: 5px;
            letter-spacing: 3px;
        }
        
        #game-title h2 {
            font-size: 1.5rem;
            color: #2d5016;
            text-shadow: 1px 1px 0 #ffd166;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
        }
        
        /* 游戏区域 */
        #game-area {
            position: absolute;
            top: 20%;
            left: 5%;
            width: 90%;
            height: 65%;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            border: 5px solid #ffd166;
            z-index: 5;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        /* 游戏说明 */
        #game-instructions {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }
        
        #game-instructions h3 {
            font-size: 1.8rem;
            color: #ff6b6b;
            margin-bottom: 10px;
        }
        
        #game-instructions p {
            font-size: 1.2rem;
            line-height: 1.5;
            color: #2d5016;
        }
        
        /* 游戏主体 */
        #game-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        /* 花朵容器 */
        #flower-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }
        
        .flower {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .flower:hover {
            transform: scale(1.1);
        }
        
        /* 游戏控制 */
        #game-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }
        
        #score-container {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 2px 2px 0 #ffd166;
        }
        
        #start-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #cc5555;
            transition: all 0.2s;
            margin-bottom: 15px;
        }
        
        #start-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #cc5555;
        }
        
        #timer {
            font-size: 1.5rem;
            color: #2d5016;
            font-weight: bold;
            background-color: rgba(255, 209, 102, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        /* 游戏结束画面 */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 20;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border-radius: 20px;
        }
        
        #game-over h2 {
            font-size: 3rem;
            color: #ffd166;
            margin-bottom: 20px;
        }
        
        #final-score {
            font-size: 2.5rem;
            color: #ff6b6b;
            margin-bottom: 30px;
        }
        
        #restart-btn {
            background-color: #4ecdc4;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #3aa8a0;
        }
        
        /* 音乐控制 */
        #music-control {
            position: absolute;
            bottom: 5%;
            right: 5%;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.8);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
        
        #music-icon {
            font-size: 1.8rem;
            color: #ff6b6b;
        }
        
        /* 装饰元素 */
        .decoration {
            position: absolute;
            z-index: 2;
        }
        
        /* 节气信息 */
        #info-panel {
            position: absolute;
            bottom: 5%;
            left: 5%;
            width: 40%;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            padding: 15px;
            z-index: 5;
            border: 3px solid #ffd166;
        }
        
        #info-panel h3 {
            color: #ff6b6b;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        
        #info-panel p {
            font-size: 1rem;
            line-height: 1.4;
            color: #2d5016;
        }
        
        /* 响应式调整 */
        @media (max-width: 480px) {
            #game-title h1 {
                font-size: 2.2rem;
            }
            
            #game-title h2 {
                font-size: 1.2rem;
            }
            
            #flower-container {
                width: 250px;
                height: 250px;
            }
            
            #info-panel {
                width: 50%;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 背景图片 -->
        <img id="background" src="" alt="立春背景">
        
        <!-- 游戏标题 -->
        <div id="game-title">
            <h1>立 春</h1>
            <h2>春暖花开小游戏</h2>
        </div>
        
        <!-- 游戏区域 -->
        <div id="game-area">
            <div id="game-instructions">
                <h3>游戏说明</h3>
                <p>点击出现的花朵，收集春日能量！60秒内点击越多花朵得分越高。</p>
            </div>
            
            <div id="game-main">
                <div id="flower-container">
                    <!-- 花朵将动态生成在这里 -->
                </div>
                
                <div id="game-controls">
                    <div id="score-container">
                        得分: <span id="score">0</span>
                    </div>
                    
                    <button id="start-btn">开始游戏</button>
                    
                    <div id="timer">
                        时间: <span id="time-left">60</span> 秒
                    </div>
                </div>
            </div>
            
            <!-- 游戏结束画面 -->
            <div id="game-over">
                <h2>游戏结束</h2>
                <div id="final-score">你的得分: <span>0</span></div>
                <button id="restart-btn">再玩一次</button>
            </div>
        </div>
        
        <!-- 节气信息 -->
        <div id="info-panel">
            <h3>立春节气</h3>
            <p>立春，二十四节气之首，标志着万物闭藏的冬季已过去，开始进入风和日暖、万物生长的春季。立春期间，气温开始上升，日照时间逐渐增加，大地回春，万象更新。</p>
        </div>
        
        <!-- 音乐控制 -->
        <div id="music-control">
            <i id="music-icon" class="fas fa-volume-up"></i>
        </div>
        
        <!-- 装饰元素 -->
        <div class="decoration" id="decoration1"></div>
        <div class="decoration" id="decoration2"></div>
        <div class="decoration" id="decoration3"></div>
        <div class="decoration" id="decoration4"></div>
    </div>
    
    <!-- 背景音乐 -->
    <audio id="background-music" loop>
        <source src="lichunbgm.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        // 游戏变量
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let timerInterval;
        let musicPlaying = true;
        
        // DOM元素
        const scoreElement = document.getElementById('score');
        const timeLeftElement = document.getElementById('time-left');
        const startBtn = document.getElementById('start-btn');
        const flowerContainer = document.getElementById('flower-container');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.querySelector('#final-score span');
        const restartBtn = document.getElementById('restart-btn');
        const backgroundMusic = document.getElementById('background-music');
        const musicControl = document.getElementById('music-control');
        const musicIcon = document.getElementById('music-icon');
        
        // 游戏素材列表
        const requiredAssets = [
            { id: 'background', name: '立春背景图', filename: 'lichun-bg.jpg', dimensions: '750x1334px (手机竖屏尺寸)' },
            { id: 'flower1', name: '花朵素材1', filename: 'flower1.png', dimensions: '100x100px' },
            { id: 'flower2', name: '花朵素材2', filename: 'flower2.png', dimensions: '100x100px' },
            { id: 'flower3', name: '花朵素材3', filename: 'flower3.png', dimensions: '100x100px' },
            { id: 'decoration1', name: '装饰素材1', filename: 'decoration1.png', dimensions: '80x80px' },
            { id: 'decoration2', name: '装饰素材2', filename: 'decoration2.png', dimensions: '80x80px' },
            { id: 'decoration3', name: '装饰素材3', filename: 'decoration3.png', dimensions: '80x80px' },
            { id: 'decoration4', name: '装饰素材4', filename: 'decoration4.png', dimensions: '80x80px' },
            { id: 'music', name: '背景音乐', filename: 'lichunbgm.mp3', dimensions: '音频文件' }
        ];
        
        // 初始化游戏
        function initGame() {
            score = 0;
            timeLeft = 60;
            gameActive = false;
            scoreElement.textContent = score;
            timeLeftElement.textContent = timeLeft;
            flowerContainer.innerHTML = '';
            gameOverScreen.style.display = 'none';
            
            // 显示素材列表（开发者用）
            console.log("所需素材列表：");
            requiredAssets.forEach(asset => {
                console.log(`${asset.name}: ${asset.filename} (${asset.dimensions})`);
            });
            
            // 尝试自动播放音乐（需要用户交互）
            document.addEventListener('click', startMusicOnce, { once: true });
        }
        
        // 开始音乐（只执行一次）
        function startMusicOnce() {
            if (musicPlaying) {
                backgroundMusic.play().catch(e => {
                    console.log("自动播放被阻止，请点击音乐控制按钮手动播放");
                });
            }
        }
        
        // 生成花朵
        function createFlower() {
            if (!gameActive) return;
            
            const flower = document.createElement('img');
            flower.className = 'flower';
            
            // 随机选择花朵类型
            const flowerTypes = ['flower1.png', 'flower2.png', 'flower3.png'];
            const randomFlower = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
            flower.src = randomFlower;
            flower.alt = '花朵';
            
            // 随机位置
            const containerWidth = flowerContainer.clientWidth;
            const containerHeight = flowerContainer.clientHeight;
            const flowerSize = 80 + Math.random() * 40; // 80-120px
            
            const x = Math.random() * (containerWidth - flowerSize);
            const y = Math.random() * (containerHeight - flowerSize);
            
            flower.style.width = `${flowerSize}px`;
            flower.style.height = `${flowerSize}px`;
            flower.style.left = `${x}px`;
            flower.style.top = `${y}px`;
            
            // 点击事件
            flower.addEventListener('click', () => {
                if (!gameActive) return;
                
                score++;
                scoreElement.textContent = score;
                
                // 点击效果
                flower.style.transform = 'scale(1.3)';
                flower.style.opacity = '0.7';
                
                setTimeout(() => {
                    if (flower.parentNode) {
                        flower.parentNode.removeChild(flower);
                    }
                }, 200);
                
                // 创建新的花朵
                setTimeout(createFlower, 300);
            });
            
            flowerContainer.appendChild(flower);
            
            // 花朵自动消失
            setTimeout(() => {
                if (flower.parentNode && gameActive) {
                    flower.parentNode.removeChild(flower);
                    createFlower();
                }
            }, 1500);
        }
        
        // 开始游戏
        function startGame() {
            if (gameActive) return;
            
            gameActive = true;
            score = 0;
            timeLeft = 60;
            scoreElement.textContent = score;
            timeLeftElement.textContent = timeLeft;
            flowerContainer.innerHTML = '';
            
            // 创建初始花朵
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createFlower(), i * 300);
            }
            
            // 启动计时器
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timeLeftElement.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
            
            startBtn.disabled = true;
            startBtn.textContent = "游戏中...";
        }
        
        // 结束游戏
        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'flex';
            
            startBtn.disabled = false;
            startBtn.textContent = "开始游戏";
        }
        
        // 重新开始游戏
        function restartGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }
        
        // 音乐控制
        function toggleMusic() {
            if (musicPlaying) {
                backgroundMusic.pause();
                musicIcon.className = 'fas fa-volume-mute';
                musicPlaying = false;
            } else {
                backgroundMusic.play();
                musicIcon.className = 'fas fa-volume-up';
                musicPlaying = true;
            }
        }
        
        // 添加装饰元素
        function addDecorations() {
            const decorations = document.querySelectorAll('.decoration');
            
            decorations.forEach((dec, index) => {
                // 随机位置
                const x = Math.random() * 90;
                const y = Math.random() * 90;
                
                dec.style.left = `${x}vw`;
                dec.style.top = `${y}vh`;
                
                // 设置装饰图片（实际使用时需要替换为真实图片）
                dec.style.width = '60px';
                dec.style.height = '60px';
                dec.style.backgroundImage = 'radial-gradient(circle, #ff9e9e, #ff6b6b)';
                dec.style.borderRadius = '50%';
                dec.style.opacity = '0.7';
                
                // 添加动画
                dec.style.animation = `float ${3 + Math.random() * 4}s infinite ease-in-out`;
            });
            
            // 添加浮动动画关键帧
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes float {
                    0%, 100% { transform: translateY(0) rotate(0deg); }
                    50% { transform: translateY(-20px) rotate(5deg); }
                }
            `;
            document.head.appendChild(style);
        }
        
        // 事件监听
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);
        musicControl.addEventListener('click', toggleMusic);
        
        // 初始化
        window.addEventListener('load', () => {
            initGame();
            addDecorations();
            
            // 提示用户点击以开始音乐
            console.log("提示：为了自动播放音乐，请点击屏幕任意位置");
        });
        
        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                e.preventDefault();
            }
        }, { passive: false });
        
        // 处理窗口大小变化
        window.addEventListener('resize', () => {
            // 确保游戏区域保持正确比例
            const gameArea = document.getElementById('game-area');
            const containerHeight = window.innerHeight;
            gameArea.style.top = `${containerHeight * 0.2}px`;
            gameArea.style.height = `${containerHeight * 0.65}px`;
        });
    </script>
</body>
</html>
